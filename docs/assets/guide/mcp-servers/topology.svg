<svg width="100%" viewBox="0 0 760 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Six MCP servers: stdio processes, no ports</title>
<desc>Claude Code spawns six local MCP server processes over stdio, in startup order: filesystem-policy, git, lancedb-rag, memory-graph, terminal, and documentation. None of them bind a network port. Five are fully local. The documentation server is the sole exception: its documentation.fetch tool is only registered for tier-0/tier-1 repos and makes an outbound HTTPS request, shown as a network egress arrow leaving the box; documentation.search stays local like the rest.</desc>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 10.5px; font-weight: 400; font-family: "SF Mono", Menlo, monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Claude Code process -->
<rect x="270" y="8" width="220" height="46" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="26" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Claude Code</text>
<text x="380" y="42" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">spawns + speaks stdio to each</text>

<line x1="380" y1="54" x2="380" y2="72" class="edge" marker-end="url(#a1)"/>
<line x1="380" y1="72" x2="90" y2="72" class="edge"/>
<line x1="380" y1="72" x2="670" y2="72" class="edge"/>
<line x1="90" y1="72" x2="90" y2="90" class="edge" marker-end="url(#a1)"/>
<line x1="230" y1="72" x2="230" y2="90" class="edge" marker-end="url(#a1)"/>
<line x1="380" y1="72" x2="380" y2="90" class="edge" marker-end="url(#a1)"/>
<line x1="530" y1="72" x2="530" y2="90" class="edge" marker-end="url(#a1)"/>
<line x1="670" y1="72" x2="670" y2="90" class="edge" marker-end="url(#a1)"/>

<!-- outer boundary: local machine -->
<rect x="20" y="86" width="720" height="560" rx="10" fill="none" stroke="rgb(95,94,90)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="34" y="104" class="s" fill="rgb(95,94,90)">local machine — stdio only, no ports bound</text>

<!-- filesystem-policy -->
<rect x="30" y="116" width="150" height="112" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="105" y="134" text-anchor="middle" class="t" fill="rgb(113,43,19)">filesystem-policy</text>
<text x="105" y="150" text-anchor="middle" class="s" fill="rgb(153,60,29)">order 1 · chokepoint</text>
<text x="40" y="168" class="m" fill="rgb(113,43,19)">filesystem.read</text>
<text x="40" y="182" class="m" fill="rgb(113,43,19)">filesystem.write</text>
<text x="40" y="196" class="m" fill="rgb(113,43,19)">filesystem.list</text>
<text x="40" y="214" class="s" fill="rgb(153,60,29)">policy + content scan</text>

<!-- git -->
<rect x="190" y="116" width="150" height="112" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="265" y="134" text-anchor="middle" class="t" fill="rgb(68,68,65)">git</text>
<text x="265" y="150" text-anchor="middle" class="s" fill="rgb(95,94,90)">order 2 · read-mostly</text>
<text x="200" y="168" class="m" fill="rgb(68,68,65)">git.log / diff</text>
<text x="200" y="182" class="m" fill="rgb(68,68,65)">git.blame / status</text>
<text x="200" y="196" class="m" fill="rgb(68,68,65)">git.show</text>
<text x="200" y="214" class="s" fill="rgb(95,94,90)">argv-only, denylist</text>

<!-- lancedb-rag -->
<rect x="350" y="116" width="150" height="112" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="425" y="134" text-anchor="middle" class="t" fill="rgb(30,90,61)">lancedb-rag</text>
<text x="425" y="150" text-anchor="middle" class="s" fill="rgb(30,90,61)">order 3 · read-only</text>
<text x="360" y="168" class="m" fill="rgb(30,90,61)">lancedb.search</text>
<text x="360" y="196" class="s" fill="rgb(30,90,61)">hybrid search + rerank</text>
<text x="360" y="214" class="s" fill="rgb(30,90,61)">poison-screened results</text>

<!-- memory-graph -->
<rect x="510" y="116" width="150" height="112" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="585" y="134" text-anchor="middle" class="t" fill="rgb(30,90,61)">memory-graph</text>
<text x="585" y="150" text-anchor="middle" class="s" fill="rgb(30,90,61)">order 4 · namespaced</text>
<text x="520" y="168" class="m" fill="rgb(30,90,61)">memory.recall/read</text>
<text x="520" y="182" class="m" fill="rgb(30,90,61)">memory.expand</text>
<text x="520" y="196" class="m" fill="rgb(30,90,61)">memory.write/link</text>
<text x="520" y="214" class="s" fill="rgb(30,90,61)">no delete/prune tool</text>

<!-- terminal -->
<rect x="30" y="250" width="310" height="128" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="185" y="268" text-anchor="middle" class="t" fill="rgb(113,43,19)">terminal</text>
<text x="185" y="284" text-anchor="middle" class="s" fill="rgb(153,60,29)">order 5 · allow-listed argv only</text>
<text x="40" y="302" class="m" fill="rgb(113,43,19)">terminal.run_tests / run_benchmarks / run_audit</text>
<text x="40" y="318" class="s" fill="rgb(153,60,29)">runs only if repo configured the command</text>
<text x="40" y="336" class="m" fill="rgb(113,43,19)">terminal.run(command)</text>
<text x="40" y="352" class="s" fill="rgb(153,60,29)">opens human_approvals row, BLOCKS on it,</text>
<text x="40" y="366" class="s" fill="rgb(153,60,29)">then runs argv-only if approved</text>

<!-- documentation -->
<rect x="360" y="250" width="300" height="128" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="510" y="268" text-anchor="middle" class="t" fill="rgb(60,52,137)">documentation</text>
<text x="510" y="284" text-anchor="middle" class="s" fill="rgb(83,74,183)">order 6 · the one exception</text>
<text x="370" y="302" class="m" fill="rgb(60,52,137)">documentation.search(query)</text>
<text x="370" y="318" class="s" fill="rgb(83,74,183)">always local — knowledge/docs corpus</text>
<text x="370" y="336" class="m" fill="rgb(60,52,137)">documentation.fetch(url)</text>
<text x="370" y="352" class="s" fill="rgb(83,74,183)">registered ONLY for tier 0/1 repos</text>
<line x1="600" y1="345" x2="700" y2="345" class="edge" stroke="rgb(153,60,29)" marker-end="url(#a1)"/>
<text x="660" y="330" text-anchor="middle" class="s" fill="rgb(153,60,29)">HTTPS</text>

<!-- external network -->
<rect x="660" y="322" width="80" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1" stroke-dasharray="3 2"/>
<text x="700" y="340" text-anchor="middle" class="s" fill="rgb(113,43,19)">external</text>
<text x="700" y="354" text-anchor="middle" class="s" fill="rgb(113,43,19)">network</text>

<!-- jetbrains optional -->
<rect x="30" y="392" width="630" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="345" y="413" text-anchor="middle" class="s" fill="rgb(95,94,90)">jetbrains (order 7, optional, IDE-provided) — not covered by this doc, still policy-respecting</text>

<text x="380" y="452" text-anchor="middle" class="s" fill="rgb(95,94,90)">Every server: stdio transport, own process, own audit actor.</text>
<text x="380" y="468" text-anchor="middle" class="s" fill="rgb(95,94,90)">Only documentation.fetch ever leaves the machine, and only at tier 0-1.</text>
</svg>
