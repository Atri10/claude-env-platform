<svg width="100%" viewBox="0 0 720 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>One tool call over stdio, generically</title>
<desc>The mechanics shared by all six servers for a single tool call: Claude Code writes a JSON-RPC call_tool request with a tool name and arguments object to the child process's stdin; the server's list_tools-declared inputSchema is advisory only, so the call_tool handler re-validates and enforces; the handler does its own work (policy check, subprocess, DB query, or HTTP fetch) and returns a list of TextContent blocks on stdout; the process never binds a listening socket.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 10.5px; font-weight: 400; font-family: "SF Mono", Menlo, monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<rect x="20" y="10" width="180" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="110" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Claude Code</text>
<text x="110" y="46" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">agent decides to call a tool</text>

<line x1="200" y1="35" x2="290" y2="35" class="edge" marker-end="url(#a2)"/>
<text x="245" y="26" text-anchor="middle" class="m" fill="rgb(95,94,90)">stdin</text>

<rect x="290" y="10" width="200" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="28" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">call_tool(name, arguments)</text>
<text x="390" y="45" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">JSON-RPC over stdio, no port</text>

<line x1="390" y1="60" x2="390" y2="82" class="edge" marker-end="url(#a2)"/>

<rect x="220" y="82" width="340" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="390" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">server-side re-validation</text>
<text x="390" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">list_tools() inputSchema is advisory only —</text>
<text x="390" y="132" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">the handler itself enforces, every time</text>

<line x1="390" y1="138" x2="390" y2="160" class="edge" marker-end="url(#a2)"/>

<!-- 4 branches -->
<rect x="20" y="160" width="160" height="90" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="100" y="180" text-anchor="middle" class="t" fill="rgb(113,43,19)">filesystem / terminal</text>
<text x="30" y="200" class="s" fill="rgb(153,60,29)">PolicyEngine.evaluate_path</text>
<text x="30" y="216" class="s" fill="rgb(153,60,29)">or allow-listed argv +</text>
<text x="30" y="232" class="s" fill="rgb(153,60,29)">approval-gate block</text>

<rect x="195" y="160" width="160" height="90" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="275" y="180" text-anchor="middle" class="t" fill="rgb(68,68,65)">git</text>
<text x="205" y="200" class="s" fill="rgb(95,94,90)">subprocess.run(argv,</text>
<text x="205" y="214" class="s" fill="rgb(95,94,90)">shell=False), denylist</text>
<text x="205" y="230" class="s" fill="rgb(95,94,90)">string-match first</text>

<rect x="370" y="160" width="160" height="90" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="450" y="180" text-anchor="middle" class="t" fill="rgb(30,90,61)">lancedb-rag / memory</text>
<text x="380" y="200" class="s" fill="rgb(30,90,61)">local query (LanceDB /</text>
<text x="380" y="214" class="s" fill="rgb(30,90,61)">SQLite via MemoryManager),</text>
<text x="380" y="230" class="s" fill="rgb(30,90,61)">poison-screen if RAG</text>

<rect x="545" y="160" width="155" height="90" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="622" y="180" text-anchor="middle" class="t" fill="rgb(60,52,137)">documentation</text>
<text x="555" y="200" class="s" fill="rgb(83,74,183)">local corpus grep, or</text>
<text x="555" y="214" class="s" fill="rgb(83,74,183)">tier-gated httpx.get()</text>
<text x="555" y="230" class="s" fill="rgb(83,74,183)">+ poison-screen</text>

<line x1="100" y1="250" x2="100" y2="272" class="edge" marker-end="url(#a2)"/>
<line x1="275" y1="250" x2="275" y2="272" class="edge" marker-end="url(#a2)"/>
<line x1="450" y1="250" x2="450" y2="272" class="edge" marker-end="url(#a2)"/>
<line x1="622" y1="250" x2="622" y2="272" class="edge" marker-end="url(#a2)"/>
<line x1="100" y1="272" x2="622" y2="272" class="edge"/>
<line x1="390" y1="272" x2="390" y2="294" class="edge" marker-end="url(#a2)"/>

<rect x="220" y="294" width="340" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="312" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">AuditLogger.tool_call(...)</text>
<text x="390" y="330" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">hash-chained event written; each server</text>
<text x="390" y="342" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">audits under its own actor name</text>

<line x1="390" y1="350" x2="390" y2="372" class="edge" marker-end="url(#a2)"/>

<rect x="290" y="372" width="200" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="390" y="390" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">list[TextContent]</text>
<text x="390" y="406" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">returned on stdout</text>

<line x1="290" y1="397" x2="200" y2="397" class="edge" marker-end="url(#a2)"/>
<text x="245" y="388" text-anchor="middle" class="m" fill="rgb(95,94,90)">stdout</text>

<text x="360" y="445" text-anchor="middle" class="s" fill="rgb(95,94,90)">Every server follows this shape: list_tools() advertises, call_tool() enforces — never the reverse.</text>
</svg>
