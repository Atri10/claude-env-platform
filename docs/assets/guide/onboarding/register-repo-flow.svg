<svg width="100%" viewBox="0 0 760 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>claude-env onboard flow</title>
<desc>Flowchart of scripts/register_repo.py main(): starting from the claude-env onboard/register command, it gathers slug/tier/branch/description (interactively or via flags), then fans out into four provisioning steps that run every time — writing .claude/repo-policy.yaml from the template, computing the RAG table name and memory namespace, patching ~/.claude.json with resolved MCP server env blocks, and installing CLAUDE.md plus .claude/skills and .claude/agents into the target repo from templates/repo-onboarding — followed by two idempotent extras (git post-commit hook, commands.json scaffold) and an optional final step offering to build the first RAG index.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Entry -->
<rect x="230" y="10" width="300" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">claude-env onboard &lt;repo&gt;</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">register_repo.py main()</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#a3)"/>

<!-- Gather details -->
<rect x="200" y="82" width="360" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Gather slug / tier / branch / description</text>
<text x="380" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">detected defaults; prompted if TTY, flags/--yes otherwise</text>
<line x1="380" y1="138" x2="380" y2="162" class="edge" marker-end="url(#a3)"/>

<!-- Fan out label -->
<text x="380" y="156" text-anchor="middle" class="s" fill="rgb(95,94,90)">provisioning (every run)</text>

<!-- Step A: repo policy -->
<rect x="30" y="172" width="330" height="62" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="195" y="192" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">1. Write .claude/repo-policy.yaml</text>
<text x="195" y="210" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">from config/repo-policy.template.yaml</text>
<text x="195" y="224" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">slug + tier + desc filled; tier&#8805;2 forces isolated: true</text>

<!-- Step B: namespaces -->
<rect x="400" y="172" width="330" height="62" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="565" y="192" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">2. Compute RAG + memory namespace</text>
<text x="565" y="210" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">RAG table &lt;slug&gt;__&lt;branch&gt;, memory ns proj-&lt;slug&gt;</text>
<text x="565" y="224" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">lancedb dir ensured; memory ns created lazily</text>

<line x1="195" y1="234" x2="195" y2="256" class="edge" marker-end="url(#a3)"/>
<line x1="565" y1="234" x2="565" y2="256" class="edge" marker-end="url(#a3)"/>

<!-- Step C: MCP env -->
<rect x="30" y="256" width="330" height="62" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="195" y="276" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">3. Patch ~/.claude.json MCP env</text>
<text x="195" y="294" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">6 servers: filesystem-policy, git, lancedb-rag,</text>
<text x="195" y="308" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">memory-graph, terminal, documentation (jetbrains skipped)</text>

<!-- Step D: template install -->
<rect x="400" y="256" width="330" height="62" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="565" y="276" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">4. Install CLAUDE.md + .claude/</text>
<text x="565" y="294" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">from templates/repo-onboarding/: managed CLAUDE.md block,</text>
<text x="565" y="308" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">.claude/skills/*, .claude/agents/* (skip if --no-template)</text>

<line x1="195" y1="318" x2="195" y2="340" class="edge" marker-end="url(#a3)"/>
<line x1="565" y1="318" x2="565" y2="340" class="edge" marker-end="url(#a3)"/>
<line x1="195" y1="340" x2="380" y2="362" class="edge"/>
<line x1="565" y1="340" x2="380" y2="362" class="edge" marker-end="url(#a3)"/>

<!-- Extras -->
<rect x="180" y="362" width="400" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="382" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Idempotent extras</text>
<text x="380" y="400" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">.git/hooks/post-commit (RAG re-index) + .claude/commands.json</text>
<text x="380" y="414" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">scaffold (run_tests auto-detected from toolchain)</text>
<line x1="380" y1="422" x2="380" y2="446" class="edge" marker-end="url(#a3)"/>

<!-- Summary -->
<rect x="180" y="446" width="400" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="466" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Print isolated workspace summary</text>
<text x="380" y="484" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">slug, tier, branch, RAG table, memory ns</text>
<line x1="380" y1="496" x2="380" y2="518" class="edge" marker-end="url(#a3)"/>

<!-- Optional index -->
<rect x="220" y="518" width="320" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="538" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">5. Offer first RAG index (opt-in)</text>
<text x="380" y="556" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">interactive prompt; else prints claude-env index hint</text>

<text x="380" y="620" text-anchor="middle" class="s" fill="rgb(95,94,90)">Everything is idempotent: existing repo-policy.yaml, .claude/ files, the post-commit hook,</text>
<text x="380" y="638" text-anchor="middle" class="s" fill="rgb(95,94,90)">and commands.json are kept unless --force-policy / --force-template is passed. --dry-run prints, writes nothing.</text>
</svg>
