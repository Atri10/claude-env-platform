[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudenv"
version = "1.0.0"
description = "claude-env - Local-first AI governance platform for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Atriya Patel"}
]
keywords = [
    "claude", "claude-code", "ai", "governance", "security", "audit",
    "rag", "mcp", "local-first", "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "certifi>=2024.0.0",
    "llama-cpp-python>=0.2.0",
    "lancedb>=0.7.0",
    "pyarrow>=14.0",
    "onnxruntime>=1.16",
    "mcp>=1.0",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.6",
    "types-PyYAML>=6.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/Atri10/claude-env-platform"
Repository = "https://github.com/Atri10/claude-env-platform"
Issues = "https://github.com/Atri10/claude-env-platform/issues"
Changelog = "https://github.com/Atri10/claude-env-platform/blob/master/CHANGELOG.md"

[project.scripts]
claude-env = "claudenv.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["claudenv*"]

[tool.setuptools.package-data]
claudenv = [
    "py.typed",
    "_data/config/*",
    "_data/sql/*",
    "_data/templates/**/*",
    # Git hooks + reindex entrypoint shipped for GitHooksStep.
    "_data/scripts/*",
    # Explicit patterns for the .claude/ dotdir tree (setuptools' ** skips
    # dotfiles/dotdirs by default).
    "_data/templates/repo-onboarding/.claude/agents/*",
    "_data/templates/repo-onboarding/.claude/skills/*/*",
    "_data/templates/repo-onboarding/.claude/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",   # line length is enforced loosely; long strings/URLs are fine
    "UP037",  # quoted annotations are intentional in some forward refs
    # `str, Enum` (not StrEnum) is deliberate: these enums are JSON-serialized
    # and rely on `str, Enum`'s str()/format() semantics. Migrating to StrEnum
    # is a behavior-sensitive change, out of scope for lint.
    "UP042",
    "E731",   # assigning a lambda is used for small local helpers; low value
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["claudenv/tests"]
asyncio_mode = "auto"