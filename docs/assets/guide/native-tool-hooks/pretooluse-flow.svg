<svg width="100%" viewBox="0 0 760 1150" role="img" xmlns="http://www.w3.org/2000/svg">
<title>policy_hook.py main() — PreToolUse decision flow</title>
<desc>A vertical flowchart of hooks/policy_hook.py's main() function for the PreToolUse hook event: incident-mode short circuit, path extraction from tool_input, Bash command inspection via _inspect_bash, the control-plane guard for native Write/Edit/NotebookEdit, the evaluate_path policy check, the MCP-first redirect for memory paths, the secret-pattern scan on write content, and the try/except wrapper showing fail-open versus fail-closed behavior when CLAUDE_ENV_HOOK_FAIL_CLOSED is set.</desc>
<defs>
<marker id="c1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Entry -->
<rect x="200" y="10" width="360" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="28" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">stdin JSON: tool_name, tool_input, cwd</text>
<text x="380" y="44" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">Read | Write | Edit | NotebookEdit | Glob | Grep | Bash</text>
<line x1="380" y1="56" x2="380" y2="78" class="edge" marker-end="url(#c1)"/>

<!-- Incident -->
<rect x="220" y="78" width="320" height="46" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="96" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">state/INCIDENT marker exists?</text>
<text x="380" y="112" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">checked first, for every tool</text>
<line x1="540" y1="101" x2="640" y2="101" class="edge" marker-end="url(#c1)"/>
<rect x="640" y="78" width="100" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="101" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="690" y="115" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">everything</text>
<line x1="380" y1="124" x2="380" y2="146" class="edge" marker-end="url(#c1)"/>

<!-- pathless bash-less -->
<rect x="200" y="146" width="360" height="52" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="164" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">no path_str, not Bash, not a write tool?</text>
<text x="380" y="182" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">e.g. Glob/Grep with no path key</text>
<line x1="560" y1="172" x2="660" y2="172" class="edge" marker-end="url(#c1)"/>
<rect x="660" y="147" width="90" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="705" y="172" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">allow</text>
<text x="705" y="188" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">return early</text>
<line x1="380" y1="198" x2="380" y2="220" class="edge" marker-end="url(#c1)"/>

<!-- Bash branch -->
<rect x="200" y="220" width="360" height="54" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="240" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">tool == Bash?</text>
<text x="380" y="258" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">_inspect_bash() — see the precedence diagram above</text>
<line x1="380" y1="274" x2="380" y2="296" class="edge" marker-end="url(#c1)" stroke-dasharray="4 3"/>
<text x="470" y="288" class="s" fill="rgb(95,94,90)">deny/ask &#8594; audit + emit, return</text>
<line x1="380" y1="274" x2="380" y2="296" class="edge" marker-end="url(#c1)"/>

<!-- Control-plane guard -->
<rect x="180" y="296" width="400" height="62" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="315" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">Write/Edit/NotebookEdit targets a control-plane file?</text>
<text x="380" y="333" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">_is_control_plane(rel, abs) AND not in repo override_deny</text>
<text x="380" y="348" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">.claude/repo-policy.yaml, .claude/settings*.json, .claude-env/{config,hooks,security,agents,sql,lib}/</text>
<line x1="580" y1="327" x2="660" y2="327" class="edge" marker-end="url(#c1)"/>
<rect x="660" y="302" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="322" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="338" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">+ audit</text>
<line x1="380" y1="358" x2="380" y2="380" class="edge" marker-end="url(#c1)"/>

<!-- evaluate_path -->
<rect x="200" y="380" width="360" height="54" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="399" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">PolicyEngine.evaluate_path(path_str)</text>
<text x="380" y="417" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">decision.action == "block"? — full logic in policy-engine.md</text>
<line x1="560" y1="407" x2="660" y2="407" class="edge" marker-end="url(#c1)"/>
<rect x="660" y="382" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="402" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="418" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">+ audit</text>
<line x1="380" y1="434" x2="380" y2="456" class="edge" marker-end="url(#c1)"/>

<!-- MCP-first -->
<rect x="200" y="456" width="360" height="62" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="475" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">write targets an MCP-owned domain?</text>
<text x="380" y="492" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">_mcp_first_hint() — e.g. .claude/&#8230;/memory/ paths</text>
<text x="380" y="507" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">only when repo has .claude/repo-policy.yaml (onboarded)</text>
<line x1="560" y1="487" x2="660" y2="487" class="edge" marker-end="url(#c1)"/>
<rect x="660" y="462" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="482" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="498" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">redirect hint</text>
<line x1="380" y1="518" x2="380" y2="540" class="edge" marker-end="url(#c1)"/>

<!-- Secret scan -->
<rect x="200" y="540" width="360" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="559" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Write/Edit/NotebookEdit content has a secret pattern?</text>
<text x="380" y="576" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">content/new_string/new_source vs security.detectors.SECRET_PATTERNS</text>
<text x="380" y="591" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">logs a security_event regardless of the answer given</text>
<line x1="560" y1="571" x2="660" y2="571" class="edge" marker-end="url(#c1)"/>
<rect x="660" y="545" width="90" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="705" y="565" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">ask</text>
<text x="705" y="581" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">confirm</text>
<line x1="380" y1="600" x2="380" y2="622" class="edge" marker-end="url(#c1)"/>

<!-- allow -->
<rect x="240" y="622" width="280" height="46" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="640" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">allow, silently</text>
<text x="380" y="656" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">no stdout printed at all</text>

<!-- Fail posture box -->
<rect x="110" y="710" width="540" height="150" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="734" text-anchor="middle" class="t" fill="rgb(68,68,65)">The whole body above runs inside one try/except</text>
<text x="380" y="758" text-anchor="middle" class="s" fill="rgb(95,94,90)">engine load failure, DB unavailable, or any unexpected exception is caught once</text>
<rect x="150" y="774" width="200" height="40" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="250" y="790" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">default: fail OPEN</text>
<text x="250" y="805" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">stay silent &#8594; allow</text>
<rect x="410" y="774" width="200" height="40" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="510" y="790" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">CLAUDE_ENV_HOOK_FAIL_CLOSED=true</text>
<text x="510" y="805" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">deny with the exception text</text>
<text x="380" y="838" text-anchor="middle" class="s" fill="rgb(95,94,90)">Malformed stdin JSON returns 0 before the try block even starts — always allow.</text>
</svg>
