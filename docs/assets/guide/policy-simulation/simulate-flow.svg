<svg width="100%" viewBox="0 0 760 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>simulate() flow — dry-running a candidate policy</title>
<desc>A flowchart showing security.policy_sim.simulate(): two inputs (the repo root and a candidate policy YAML file) feed into a step that enumerates the repo's files (git ls-files, or a capped rglob fallback) and builds two PolicyEngine instances — one for the current on-disk policy, one compiled in-memory from the candidate doc. Every file is evaluated against both engines and the actions are diffed, producing three categorized outputs: newly blocked files, newly allowed files, and files still blocked but by a different rule, plus summary counts. No state is written; both engines are read-only and stateless.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Inputs row -->
<rect x="30" y="10" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="190" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">repo_root</text>
<text x="190" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">PolicyEngine.load(repo_root, GLOBAL_POLICY)</text>

<rect x="410" y="10" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="570" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">--candidate new-policy.yaml</text>
<text x="570" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">yaml.safe_load() -&#8594; _engine_for_doc()</text>

<line x1="190" y1="64" x2="190" y2="86" class="edge" marker-end="url(#a3)"/>
<line x1="570" y1="64" x2="570" y2="86" class="edge" marker-end="url(#a3)"/>

<!-- Two engines row -->
<rect x="30" y="86" width="320" height="54" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="190" y="106" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">current PolicyEngine</text>
<text x="190" y="124" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">on-disk .claude/repo-policy.yaml</text>

<rect x="410" y="86" width="320" height="54" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="570" y="106" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">candidate PolicyEngine</text>
<text x="570" y="124" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">in-memory doc, same _compile()</text>

<line x1="190" y1="140" x2="190" y2="162" class="edge"/>
<line x1="570" y1="140" x2="570" y2="162" class="edge"/>
<line x1="190" y1="162" x2="380" y2="184" class="edge"/>
<line x1="570" y1="162" x2="380" y2="184" class="edge" marker-end="url(#a3)"/>
<line x1="190" y1="162" x2="380" y2="184" class="edge" marker-end="url(#a3)"/>

<!-- File enumeration -->
<rect x="220" y="184" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="204" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">_repo_files(repo_root)</text>
<text x="380" y="222" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">git ls-files, else rglob("*") capped at 20000</text>
<line x1="380" y1="238" x2="380" y2="260" class="edge" marker-end="url(#a3)"/>

<!-- Evaluate every file against both -->
<rect x="180" y="260" width="400" height="58" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="280" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">for each file: evaluate_path() twice</text>
<text x="380" y="298" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">cur = current.evaluate_path(f)   cand = candidate.evaluate_path(f)</text>
<line x1="380" y1="318" x2="380" y2="340" class="edge" marker-end="url(#a3)"/>

<!-- Diff decision -->
<rect x="220" y="340" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="360" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">compare cur.action vs cand.action</text>
<text x="380" y="378" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">(and cur.rule vs cand.rule when both block)</text>

<line x1="280" y1="394" x2="150" y2="440" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="394" x2="380" y2="440" class="edge" marker-end="url(#a3)"/>
<line x1="480" y1="394" x2="610" y2="440" class="edge" marker-end="url(#a3)"/>

<!-- Three outputs -->
<rect x="30" y="440" width="240" height="58" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="150" y="460" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">newly_blocked</text>
<text x="150" y="478" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">cur=allow, cand=block</text>

<rect x="260" y="440" width="240" height="58" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="460" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">blocked_rule_changes</text>
<text x="380" y="478" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">still block, but rule differs</text>

<rect x="490" y="440" width="240" height="58" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="610" y="460" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">newly_allowed</text>
<text x="610" y="478" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">cur=block, cand=allow</text>

<line x1="150" y1="498" x2="330" y2="540" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="498" x2="380" y2="540" class="edge" marker-end="url(#a3)"/>
<line x1="610" y1="498" x2="430" y2="540" class="edge" marker-end="url(#a3)"/>

<!-- Final dict -->
<rect x="140" y="540" width="480" height="74" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="562" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">returned dict</text>
<text x="380" y="580" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">repo, candidate, tier_current, tier_candidate, counts,</text>
<text x="380" y="596" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">newly_blocked, newly_allowed, blocked_rule_changes</text>

<text x="380" y="630" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: read-only — no file, DB row, or policy is ever written by simulate().</text>
</svg>
