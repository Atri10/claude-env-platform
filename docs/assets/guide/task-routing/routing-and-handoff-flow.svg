<svg width="100%" viewBox="0 0 760 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Task routing and handoff flow</title>
<desc>A vertical flowchart: a task string and optional target path enter TaskRouter.rank, which scores every registered specialist agent using three independent signals — intent-keyword regex matches, a target-path-in-write_paths bonus, and a write/read-only capability adjustment. Agents scoring above zero are ranked; route() returns the top score or falls back to the orchestrator agent if nothing scored. needs_clarification() flags a tie within a fixed margin of 1.0. The chosen agent then becomes the destination of a HandoffHub.handoff call, which validates the destination exists, checks (but does not enforce) that handed-off paths fall within its write_paths, builds a HandoffPacket, and records the transfer as an agent_action audit event before returning the packet to the receiver.</desc>
<defs>
<marker id="b3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: inputs -->
<rect x="220" y="10" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">task text + optional target path</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">TaskRouter.rank(task, target)</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#b3)"/>

<!-- Step 2: scoring loop -->
<rect x="140" y="82" width="480" height="120" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">score each agent (except orchestrator)</text>
<text x="380" y="122" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">1. intent regex hits (_INTENT) &#8594; += weight (2 or 3)</text>
<text x="380" y="140" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">2. target inside agent's write_paths (fnmatch) &#8594; += 2.5</text>
<text x="380" y="158" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">3. write task vs. read-only agent &#8594; -2.0</text>
<text x="380" y="176" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">   non-write task vs. analysis specialist &#8594; +0.5</text>
<line x1="380" y1="202" x2="380" y2="224" class="edge" marker-end="url(#b3)"/>

<!-- Step 3: filter+sort -->
<rect x="220" y="224" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="244" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">keep score &gt; 0, sort descending</text>
<text x="380" y="262" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">list[RoutingDecision]</text>
<line x1="380" y1="274" x2="380" y2="296" class="edge" marker-end="url(#b3)"/>

<!-- Step 4: route decision, branch -->
<rect x="220" y="296" width="320" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="316" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">route() returns ranked[0]</text>
<text x="380" y="334" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">needs_clarification(): top two within margin 1.0?</text>
<line x1="540" y1="324" x2="640" y2="324" class="edge" marker-end="url(#b3)"/>
<rect x="640" y="298" width="100" height="52" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="318" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">empty ranking</text>
<text x="690" y="336" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(113,43,19)">&#8594; orchestrator</text>
<line x1="380" y1="352" x2="380" y2="374" class="edge" marker-end="url(#b3)"/>

<!-- Step 5: handoff -->
<rect x="180" y="374" width="400" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="394" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">HandoffHub.handoff(src, dst, objective, paths, ...)</text>
<text x="380" y="412" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">dst = chosen specialist agent</text>
<line x1="380" y1="430" x2="380" y2="452" class="edge" marker-end="url(#b3)"/>

<!-- Step 6: validate -->
<rect x="140" y="452" width="480" height="70" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="472" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">_validate(src, dst, paths)</text>
<text x="380" y="490" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">unknown src/dst &#8594; raise ValueError</text>
<text x="380" y="506" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">path outside dst.write_paths &#8594; security_event (low), not blocked</text>
<line x1="380" y1="522" x2="380" y2="544" class="edge" marker-end="url(#b3)"/>

<!-- Step 7: build + record -->
<rect x="180" y="544" width="400" height="70" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="564" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">build HandoffPacket</text>
<text x="380" y="582" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">record agent_action(agent=src, action="handoff", target=dst)</text>
<text x="380" y="598" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">in the audit ledger &#8594; packet.audit_event_id</text>
<line x1="380" y1="614" x2="380" y2="636" class="edge" marker-end="url(#b3)"/>

<!-- Step 8: output -->
<rect x="220" y="636" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="656" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">packet.context</text>
<text x="380" y="674" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">XML DATA block injected into dst's prompt</text>

<text x="380" y="710" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: routing and scope checks are advisory — PolicyEngine/ApprovalGate enforce at execution time.</text>
</svg>
