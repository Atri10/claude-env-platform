<svg width="100%" viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Memory graph shape: nodes, edges, namespaces</title>
<desc>Example memory graph with a session node, a decision node, an entity node and an architecture node connected by RELATES_TO, DECISION_ABOUT and DISCOVERED_IN edges inside namespace proj-payments, plus a SUPERSEDES edge to an older decision node marked superseded, and a separate global namespace box holding a procedural workflow node that is only reachable when a caller is not isolated and explicitly requests the global namespace.</desc>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
  .lbl { font-size: 10px; font-weight: 400; }
</style>

<!-- namespace box: proj-payments -->
<rect x="20" y="20" width="500" height="330" rx="10" fill="none" stroke="rgb(95,94,90)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36" y="40" class="s" fill="rgb(95,94,90)">namespace: proj-payments</text>

<!-- session node (episodic) -->
<rect x="50" y="60" width="180" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="140" y="80" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">session (episodic)</text>
<text x="140" y="98" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">half_life=30d</text>

<!-- decision node (episodic, current) -->
<rect x="290" y="60" width="200" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="390" y="80" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">decision (episodic)</text>
<text x="390" y="98" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">half_life=365d</text>

<line x1="230" y1="88" x2="284" y2="88" class="edge" marker-end="url(#a1)"/>
<text x="257" y="78" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">RELATES_TO</text>

<!-- superseded decision node -->
<rect x="290" y="140" width="200" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="158" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">decision (old)</text>
<text x="390" y="176" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">superseded_by set</text>

<line x1="390" y1="116" x2="390" y2="134" class="edge" marker-end="url(#a1)"/>
<text x="440" y="128" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">SUPERSEDES</text>

<!-- entity node (semantic) -->
<rect x="50" y="220" width="180" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="140" y="240" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">entity (semantic)</text>
<text x="140" y="258" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">half_life=180d</text>

<line x1="140" y1="116" x2="140" y2="214" class="edge" marker-end="url(#a1)"/>
<text x="195" y="168" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">DISCOVERED_IN</text>

<!-- architecture node (semantic) -->
<rect x="290" y="220" width="200" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="390" y="240" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">architecture (semantic)</text>
<text x="390" y="258" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">half_life=365d</text>

<line x1="390" y1="116" x2="390" y2="214" class="edge" marker-end="url(#a1)"/>
<text x="440" y="168" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">DECISION_ABOUT</text>

<line x1="230" y1="248" x2="284" y2="248" class="edge" marker-end="url(#a1)"/>
<text x="257" y="238" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">RELATES_TO</text>

<!-- isolation note -->
<rect x="50" y="300" width="440" height="34" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="270" y="317" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(113,43,19)">isolated=True: expand() and _ns_filter() never cross this boundary</text>

<!-- global namespace box -->
<rect x="560" y="60" width="170" height="230" rx="10" fill="none" stroke="rgb(95,94,90)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="645" y="80" text-anchor="middle" class="s" fill="rgb(95,94,90)">namespace: global</text>

<rect x="580" y="110" width="130" height="56" rx="8" fill="rgb(255,247,224)" stroke="rgb(158,119,15)" stroke-width="1"/>
<text x="645" y="130" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(122,90,10)">workflow</text>
<text x="645" y="148" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(158,119,15)">(procedural)</text>

<line x1="520" y1="130" x2="574" y2="130" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
<text x="645" y="195" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">only reachable via</text>
<text x="645" y="209" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">extra_ns=["global"]</text>
<text x="645" y="223" text-anchor="middle" class="lbl" fill="rgb(95,94,90)">when isolated=False</text>

<text x="380" y="405" text-anchor="middle" class="s" fill="rgb(95,94,90)">Nodes carry memory_type + node_kind (VALID_KINDS); edges carry rel + weight.</text>
<text x="380" y="423" text-anchor="middle" class="s" fill="rgb(95,94,90)">expand() walks memory_edges via a recursive CTE, filtered by namespace at every hop.</text>
</svg>
