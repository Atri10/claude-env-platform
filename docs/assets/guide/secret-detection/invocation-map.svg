<svg width="100%" viewBox="0 0 760 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Where the three detector classes are invoked</title>
<desc>A map showing security/detectors.py in the center, with three classes
(PromptInjectionDetector, SecretDetector, RagPoisonDetector) and their respective callers:
RagPoisonDetector is called from the lancedb-rag MCP server at retrieval time and the
documentation MCP server at fetch time; SecretDetector.redact is called from the memory
session ingestor and memory sync export path; PromptInjectionDetector is used directly by
validation/validate_security.py and internally by RagPoisonDetector. A separate note shows
that hooks/policy_hook.py imports the raw SECRET_PATTERNS list rather than the SecretDetector
class, for Bash and Write/Edit content scanning.</desc>
<defs>
<marker id="c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Center: detectors.py -->
<rect x="260" y="10" width="240" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">security/detectors.py</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">3 classes + 2 pattern lists</text>

<!-- RagPoisonDetector column -->
<line x1="320" y1="66" x2="160" y2="110" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="110" width="280" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="160" y="130" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">RagPoisonDetector</text>
<text x="160" y="146" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">wraps PromptInjectionDetector + density</text>

<line x1="160" y1="160" x2="160" y2="184" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="184" width="280" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="160" y="204" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">mcp-servers/lancedb-rag/server.py</text>
<text x="160" y="222" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">scan_chunk() per retrieved hit — blocked</text>
<text x="160" y="236" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">chunks silently dropped from results</text>

<line x1="160" y1="240" x2="160" y2="264" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="264" width="280" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="160" y="284" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">mcp-servers/documentation/server.py</text>
<text x="160" y="302" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">scan_chunk() on fetched body — blocked</text>
<text x="160" y="316" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">fetch returns a BLOCKED message instead</text>

<!-- SecretDetector column -->
<line x1="380" y1="66" x2="380" y2="110" class="edge" marker-end="url(#c3)"/>
<rect x="240" y="110" width="280" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="130" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">SecretDetector</text>
<text x="380" y="146" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.scan() and .redact()</text>

<line x1="380" y1="160" x2="380" y2="184" class="edge" marker-end="url(#c3)"/>
<rect x="240" y="184" width="280" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="204" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">memory/session_ingestor.py</text>
<text x="380" y="222" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">.redact() on task/outcome text before</text>
<text x="380" y="236" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">every episodic session node is stored</text>

<line x1="380" y1="240" x2="380" y2="264" class="edge" marker-end="url(#c3)"/>
<rect x="240" y="264" width="280" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="284" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">memory/memory_sync.py</text>
<text x="380" y="302" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">.redact() on node name/body_json at</text>
<text x="380" y="316" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">EXPORT time, before cross-agent sharing</text>

<!-- PromptInjectionDetector column -->
<line x1="440" y1="66" x2="600" y2="110" class="edge" marker-end="url(#c3)"/>
<rect x="460" y="110" width="280" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="600" y="130" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">PromptInjectionDetector</text>
<text x="600" y="146" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.scan(text, source)</text>

<line x1="600" y1="160" x2="600" y2="184" class="edge" marker-end="url(#c3)"/>
<rect x="460" y="184" width="280" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="600" y="204" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">validation/validate_security.py</text>
<text x="600" y="222" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">exercises all 3 classes directly with</text>
<text x="600" y="236" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">known-bad inputs (no pytest file exists)</text>

<!-- Separate note: SECRET_PATTERNS raw import -->
<rect x="120" y="370" width="520" height="90" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="392" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">hooks/policy_hook.py — different pattern entirely</text>
<text x="380" y="412" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">imports the raw SECRET_PATTERNS list, NOT the SecretDetector class</text>
<text x="380" y="428" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">re.search() per pattern on Bash command strings and Write/Edit content;</text>
<text x="380" y="444" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">result is "ask" (human confirms), never a silent block or redact</text>
<line x1="380" y1="66" x2="380" y2="370" class="edge" stroke-dasharray="4,3"/>

<text x="380" y="500" text-anchor="middle" class="s" fill="rgb(95,94,90)">All three classes write security_event rows on flag/block — the audit ledger, never the</text>
<text x="380" y="518" class="s" text-anchor="middle" fill="rgb(95,94,90)">caller's return value alone, is the durable record that a detection happened.</text>
</svg>
