# =============================================================================
# repo-policy.yaml  ::  SCHEMA + ANNOTATED TEMPLATE
# Location (per repo):  <repo>/.claude/repo-policy.yaml
# Location (global):    ~/.claude-env/config/global-policy.yaml
# Resolution order:     global deny  ->  tier rules  ->  repo deny  ->  repo allow
#                       (deny always wins; tier-3 is default-deny)
# Consumed by:          security/policy_engine.py
# =============================================================================

version: 1

# Privacy tier for this repository. Controls default posture.
#   0 public | 1 internal | 2 sensitive | 3 highly restricted
tier: 1

repo: "EXAMPLE-REPO-SLUG"        # stable slug; used for RAG/memory namespacing
description: "Human-readable purpose of this repo's policy."

# ---------------------------------------------------------------------------
# ALLOW RULES
# Files matched here are readable by agents (subject to deny rules, which win).
# For tier 3 this list is authoritative: anything not allowed is denied.
# ---------------------------------------------------------------------------
allow:
  paths:                          # glob paths (fnmatch semantics), repo-relative
    - "src/**"
    - "docs/**"
    - "ADRs/**"
    - "RFCs/**"
    - "tests/**"
    - "README.md"
    - "*.md"
  extensions:                     # bare extensions, with leading dot
    - ".py"
    - ".ts"
    - ".tsx"
    - ".go"
    - ".java"
    - ".kt"
    - ".cs"
    - ".rs"
    - ".md"
    - ".sql"        # NOTE: tier>=2 overrides and blocks .sql (see tier rules)

# ---------------------------------------------------------------------------
# DENY RULES  (always evaluated; always win over allow)
# ---------------------------------------------------------------------------
deny:
  paths:
    - "**/secrets/**"
    - "**/credentials/**"
    - "**/.ssh/**"
    - "**/.gnupg/**"
    - "**/config/production.*"
    - "**/config/prod.*"
    - "**/data/private/**"
    - "**/exports/**"
    - "**/customer_data/**"
    - "**/pii/**"
    - "**/backups/**"
    - "**/*.bak"
  extensions:
    - ".env"
    - ".pem"
    - ".p12"
    - ".pfx"
    - ".key"
    - ".crt"
    - ".cer"
    - ".gpg"
    - ".asc"
    - ".keystore"
    - ".jks"
  # Regex rules run against the full repo-relative path string.
  regex:
    - pattern: '(^|/)\.env($|\.)'
      reason: "dotenv files"
    - pattern: '(^|/)id_(rsa|ed25519|dsa|ecdsa)$'
      reason: "private SSH keys"
    - pattern: '(^|/)(settings|config)[._](prod|production|staging)\.'
      reason: "non-dev configs"
    - pattern: 'migrations/.*seed.*'
      reason: "seeds may contain sample customer data"

# ---------------------------------------------------------------------------
# OVERRIDE_DENY  -- explicit per-path escape hatch (use sparingly)
# Paths listed here are READ/INDEXABLE even when a global or repo deny rule
# would otherwise block them — WITHOUT editing the global policy. Intended for
# safe, deny-shaped files such as example/template env files that hold only
# placeholders. Evaluated before deny (deny otherwise wins); incident mode still
# blocks everything, and content_scan below STILL runs, so a real secret placed
# in an overridden file is still redacted/blocked. Prefer exact paths over globs.
# ---------------------------------------------------------------------------
override_deny:
  # - "sample-services/trip_analyzer/example.env"
  # - "sample-clients/data-web-client/.env.local.example"
  # - "**/*.env.example"

# Content-level secret scanning applied to ALLOWED files before bytes are
# returned to an agent. A match redacts the span or blocks the file.
content_scan:
  enabled: true
  on_match: "redact"              # 'redact' | 'block'
  patterns:
    - name: "aws_access_key"
      pattern: 'AKIA[0-9A-Z]{16}'
    - name: "generic_api_key"
      pattern: '(?i)(api[_-]?key|secret)["'']?\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}'
    - name: "private_key_block"
      pattern: '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
    - name: "jwt"
      pattern: 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

# ---------------------------------------------------------------------------
# RAG SCOPE  -- which allowed files actually get indexed
# ---------------------------------------------------------------------------
rag:
  enabled: true                  # tier 3 forces this to false unless opt-in
  index_paths:
    - "src/**"
    - "docs/**"
    - "ADRs/**"
    - "RFCs/**"
    - "README.md"
  exclude_paths:
    - "src/generated/**"
    - "src/proto/**"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    # binary/asset files — the indexer also skips these via a binary sniff, but
    # excluding them here avoids even reading them.
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.gif"
    - "**/*.svg"
    - "**/*.ico"
    - "**/*.pdf"
    - "**/*.zip"
    - "**/*.gz"
    - "**/*.tar"
    - "**/*.lock"
    - "**/*.min.js"
    - "**/*.map"
  index_only_committed: true     # never index the working tree / untracked files

# ---------------------------------------------------------------------------
# MEMORY SCOPE
# ---------------------------------------------------------------------------
memory:
  namespace: "proj-EXAMPLE-REPO-SLUG"
  isolated: false                # tier>=2 forces true (no cross-project reads)
  share_with_agents:             # which agents may read this namespace
    - architect
    - backend
    - testing
    - documentation

# ---------------------------------------------------------------------------
# AGENT PERMISSIONS  -- per-agent override of registry defaults for THIS repo.
# Omitted agents fall back to agents/agent_registry.yaml defaults.
# ---------------------------------------------------------------------------
agent_permissions:
  backend:
    write_paths: ["src/**", "tests/**"]
    deny_tools:  ["terminal.exec_unrestricted"]
  devops:
    requires_approval: true      # every action gated by human approval
