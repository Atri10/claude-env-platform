<svg width="100%" viewBox="0 0 760 660" role="img" xmlns="http://www.w3.org/2000/svg">
<title>claude-env validate: six validators feeding one pass/fail report</title>
<desc>Six independent validator scripts under validation/ — installation, security, memory,
agents, mcp, and features — each run as a separate subprocess by bin/claude-env's validate
command, each printing its own PASS/FAIL/WARN lines and returning its own exit code. The CLI
ORs all exit codes together into one overall result: a single non-zero exit if any validator
failed, plus a companion validate_rag.py under rag/ invoked the same way for "validate all".</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 12px; font-weight: 500; }
  .s { font-size: 10.5px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<text x="380" y="20" text-anchor="middle" class="t" fill="rgb(68,68,65)">claude-env validate [all|&lt;name&gt;]</text>

<!-- CLI dispatcher box -->
<rect x="240" y="34" width="280" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="51" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">bin/claude-env</text>
<text x="380" y="66" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">spawns one subprocess per validator, ORs exit codes</text>

<!-- fan-out from dispatcher bottom center to row 1 (3 columns: x=135,380,625) -->
<path d="M380 76 L380 88 L135 88 L135 100" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 76 L380 100" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 76 L380 88 L625 88 L625 100" fill="none" class="edge" marker-end="url(#a3)"/>

<!-- Row 1: 3 columns, 230px wide, 15px gaps -> x = 20, 265, 510 -->
<rect x="20" y="100" width="230" height="68" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="135" y="119" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">validate_installation</text>
<text x="135" y="137" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">venv, dirs, DB tables,</text>
<text x="135" y="151" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">RAG config, audit chain</text>

<rect x="265" y="100" width="230" height="68" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="119" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">validate_security</text>
<text x="380" y="137" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">policy block/allow, content</text>
<text x="380" y="151" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">scan, detectors, append-only</text>

<rect x="510" y="100" width="230" height="68" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="625" y="119" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">validate_memory</text>
<text x="625" y="137" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">node/edge round-trip, recall,</text>
<text x="625" y="151" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">supersede, isolation, decay</text>

<!-- fan-out from dispatcher to row 2 (bypassing row 1) -->
<path d="M380 76 L380 88 L135 88 L135 190" fill="none" class="edge" stroke-dasharray="2,3"/>
<path d="M135 190 L135 202" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 190" fill="none" class="edge" stroke-dasharray="2,3"/>
<path d="M380 190 L380 202" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L625 88 L625 190" fill="none" class="edge" stroke-dasharray="2,3"/>
<path d="M625 190 L625 202" fill="none" class="edge" marker-end="url(#a3)"/>

<!-- Row 2: same 3 columns -->
<rect x="20" y="202" width="230" height="68" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="135" y="221" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">validate_agents</text>
<text x="135" y="239" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">registry, router, approval</text>
<text x="135" y="253" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">gate, conflict resolver</text>

<rect x="265" y="202" width="230" height="68" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="221" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">validate_mcp</text>
<text x="380" y="239" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">topology, startup order,</text>
<text x="380" y="253" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">per-server security posture</text>

<rect x="510" y="202" width="230" height="68" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="625" y="221" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">validate_features</text>
<text x="625" y="239" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">hooks, incident, sync,</text>
<text x="625" y="253" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">CLI coverage, isolated env</text>

<!-- converge to report -->
<path d="M135 168 L135 340 L380 340" fill="none" class="edge"/>
<path d="M380 168 L380 340" fill="none" class="edge"/>
<path d="M625 168 L625 340 L380 340" fill="none" class="edge"/>
<path d="M135 270 L135 340 L380 340" fill="none" class="edge"/>
<path d="M625 270 L625 340 L380 340" fill="none" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="340" x2="380" y2="362" class="edge" marker-end="url(#a3)"/>

<!-- report box -->
<rect x="180" y="362" width="400" height="70" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="384" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">printed PASS / WARN / FAIL lines per check</text>
<text x="380" y="402" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">each script exits 0 (all pass, warns OK) or 1 (any FAIL)</text>
<text x="380" y="418" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">"validate all" ORs every exit code into one result</text>

<line x1="380" y1="432" x2="380" y2="454" class="edge" marker-end="url(#a3)"/>

<rect x="240" y="454" width="140" height="46" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="310" y="477" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">exit 0</text>
<rect x="380" y="454" width="140" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="450" y="477" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">exit 1 (any FAIL)</text>

<text x="380" y="550" text-anchor="middle" class="s" fill="rgb(95,94,90)">Each validator is an independent, standalone script — there is no shared</text>
<text x="380" y="566" text-anchor="middle" class="s" fill="rgb(95,94,90)">runner class; "all" is just the CLI looping subprocess calls and OR-ing exit codes.</text>
<text x="380" y="592" text-anchor="middle" class="s" fill="rgb(95,94,90)">A seventh target, "rag" &#8594; rag/validate_rag.py, runs the same way but lives</text>
<text x="380" y="608" text-anchor="middle" class="s" fill="rgb(95,94,90)">outside validation/ (covered in the RAG pipeline doc, not here).</text>
</svg>
