<svg width="100%" viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Confidence decay curves by node_kind half-life</title>
<desc>Line chart of effective_confidence over elapsed days for stored confidence 1.0, plotting the exponential decay formula stored times 2 to the power of negative age in days divided by half_life_days, for three half-lives: 30 days (session/investigation), 180 days (entity), and 540 days (workflow/convention). Each curve starts at confidence 1.0 and crosses 0.5 exactly at its half-life day, illustrating why short-half-life episodic memories fade fast while long-half-life procedural memories stay near full confidence for a long time.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .axis { stroke: rgb(137,135,129); stroke-width: 1px; }
  .grid { stroke: rgb(225,223,217); stroke-width: 1px; }
</style>

<text x="380" y="24" text-anchor="middle" class="t" fill="rgb(68,68,65)">effective_confidence(stored, half_life, updated_at) = stored * 2^(-age_days / half_life_days)</text>

<!-- axes: plot area x:70-720 y:60-380, x-range 0-600 days -->
<line x1="70" y1="380" x2="720" y2="380" class="axis" marker-end="url(#a2)"/>
<line x1="70" y1="380" x2="70" y2="50" class="axis" marker-end="url(#a2)"/>
<text x="720" y="400" text-anchor="end" class="s" fill="rgb(95,94,90)">age (days)</text>
<text x="22" y="215" text-anchor="middle" class="s" fill="rgb(95,94,90)" transform="rotate(-90 22 215)">confidence</text>

<!-- gridlines / labels x -->
<line x1="180" y1="60" x2="180" y2="380" class="grid"/>
<text x="180" y="396" text-anchor="middle" class="s" fill="rgb(95,94,90)">150</text>
<line x1="290" y1="60" x2="290" y2="380" class="grid"/>
<text x="290" y="396" text-anchor="middle" class="s" fill="rgb(95,94,90)">300</text>
<line x1="400" y1="60" x2="400" y2="380" class="grid"/>
<text x="400" y="396" text-anchor="middle" class="s" fill="rgb(95,94,90)">450</text>
<line x1="510" y1="60" x2="510" y2="380" class="grid"/>
<text x="510" y="396" text-anchor="middle" class="s" fill="rgb(95,94,90)">600</text>
<text x="70" y="396" text-anchor="middle" class="s" fill="rgb(95,94,90)">0</text>

<!-- gridlines y: 1.0, 0.5, 0.25 -->
<line x1="70" y1="60" x2="720" y2="60" class="grid"/>
<text x="60" y="64" text-anchor="end" class="s" fill="rgb(95,94,90)">1.0</text>
<line x1="70" y1="220" x2="720" y2="220" class="grid"/>
<text x="60" y="224" text-anchor="end" class="s" fill="rgb(95,94,90)">0.5</text>
<line x1="70" y1="300" x2="720" y2="300" class="grid"/>
<text x="60" y="304" text-anchor="end" class="s" fill="rgb(95,94,90)">0.25</text>

<!-- half-life = 30 days: session/investigation (rust) -->
<path d="M 70 60 L 92.7 220 L 115.3 300 L 138 340 L 160.7 360 L 183.3 370 L 206 375 L 228.7 377.5 L 251.3 378.7 L 274 379.4 L 296.7 379.7 L 319.3 379.8 L 342 379.9 L 364.7 379.95 L 387.3 379.97 L 410 379.99 L 432.7 379.99 L 455.3 380 L 478 380 L 500.7 380 L 523.3 380 L 546 380 L 568.7 380 L 591.3 380 L 614 380 L 636.7 380 L 659.3 380 L 682 380 L 704.7 380 L 720 380"
      fill="none" stroke="rgb(153,60,29)" stroke-width="2"/>
<text x="140" y="330" class="s" fill="rgb(153,60,29)">half_life=30 (session, investigation)</text>

<!-- half-life = 180 days: entity (purple) -->
<path d="M 70 60 C 200 60, 250 130, 290 220 C 330 300, 380 350, 450 370 C 520 380, 600 380, 720 380"
      fill="none" stroke="rgb(83,74,183)" stroke-width="2"/>
<text x="330" y="255" class="s" fill="rgb(83,74,183)">half_life=180 (entity)</text>

<!-- half-life = 365 days: decision/architecture/pattern (neutral gray) -->
<path d="M 70 60 C 250 60, 350 90, 420 150 C 490 210, 560 280, 650 330 C 690 350, 710 365, 720 372"
      fill="none" stroke="rgb(95,94,90)" stroke-width="2"/>
<text x="470" y="195" class="s" fill="rgb(95,94,90)">half_life=365 (decision, architecture, pattern)</text>

<!-- half-life = 540 days: workflow/convention (green) -->
<path d="M 70 60 C 280 60, 400 65, 500 90 C 600 115, 680 150, 720 175"
      fill="none" stroke="rgb(46,125,86)" stroke-width="2"/>
<text x="520" y="145" text-anchor="end" class="s" fill="rgb(30,90,61)">half_life=540 (workflow, convention)</text>

<text x="380" y="430" text-anchor="middle" class="s" fill="rgb(95,94,90)">Each curve crosses confidence 0.5 exactly at age = its own half_life_days.</text>
<text x="380" y="446" text-anchor="middle" class="s" fill="rgb(95,94,90)">decay_all() persists this curve into stored confidence so pruning thresholds stay stable between reads.</text>
</svg>
