<svg width="100%" viewBox="0 0 760 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>usage_boosts() reranking boost curve</title>
<desc>A line chart showing the retrieval feedback boost as a function of historical used-signal count: boost = 0.05 * ln(1 + min(used_count, 20)). The curve rises quickly for the first few uses, then flattens, and is capped once used_count reaches 20, at approximately 0.152.</desc>
<defs>
<marker id="c1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .axis { stroke: rgb(137,135,129); stroke-width: 1.5px; }
  .grid { stroke: rgb(223,221,214); stroke-width: 1px; }
</style>

<text x="380" y="26" text-anchor="middle" class="t" fill="rgb(60,52,137)">boost = BOOST_UNIT * ln(1 + min(used_count, CAP))</text>
<text x="380" y="44" text-anchor="middle" class="s" fill="rgb(95,94,90)">BOOST_UNIT = 0.05, CAP = 20 (observability/feedback.py:32-33)</text>

<!-- axes -->
<line x1="90" y1="400" x2="700" y2="400" class="axis" marker-end="url(#c1)"/>
<line x1="90" y1="400" x2="90" y2="70" class="axis" marker-end="url(#c1)"/>
<text x="700" y="420" text-anchor="end" class="s" fill="rgb(95,94,90)">used_count</text>
<text x="70" y="70" text-anchor="end" class="s" fill="rgb(95,94,90)">boost</text>

<!-- gridlines at cap -->
<line x1="670" y1="400" x2="670" y2="70" class="grid" stroke-dasharray="3,3"/>
<text x="670" y="416" text-anchor="middle" class="s" fill="rgb(95,94,90)">20 (CAP)</text>
<line x1="90" y1="127" x2="700" y2="127" class="grid" stroke-dasharray="3,3"/>
<text x="80" y="131" text-anchor="end" class="s" fill="rgb(153,60,29)">0.152 max</text>

<!-- curve: boost(n) = 0.05*ln(1+min(n,20)), x scaled 90..670 over n=0..20, y scaled 400..127 over 0..0.152 -->
<path d="M90,400
  L119,357.7 L148,335.6 L177,320.0 L206,307.9 L235,297.9 L264,289.5 L293,282.2
  L322,275.7 L351,269.9 L380,264.6 L409,259.8 L438,255.3 L467,251.2 L496,247.3
  L525,243.7 L554,240.3 L583,237.1 L612,234.0 L641,231.1 L670,228.4"
  fill="none" stroke="rgb(83,74,183)" stroke-width="2.5"/>
<line x1="670" y1="228.4" x2="700" y2="228.4" stroke="rgb(83,74,183)" stroke-width="2.5" stroke-dasharray="4,3"/>
<circle cx="670" cy="228.4" r="4" fill="rgb(83,74,183)"/>
<text x="700" y="215" text-anchor="end" class="s" fill="rgb(60,52,137)">flat past CAP: extra "used" signals add nothing more</text>

<!-- annotation for first use -->
<circle cx="119" cy="357.7" r="4" fill="rgb(46,125,86)"/>
<text x="140" y="345" class="s" fill="rgb(30,90,61)">n=1 &#8594; 0.05*ln(2) &#8776; 0.035</text>

<rect x="120" y="440" width="520" height="34" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="460" text-anchor="middle" class="s" fill="rgb(68,68,65)">Bounded by design: enough to re-order near-ties, never enough to overrule a clear reranker loser.</text>
</svg>
