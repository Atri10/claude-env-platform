[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudenv"
version = "1.0.0"
description = "claude-env - Local-first AI governance platform for Claude Code"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "claude-env contributors", email = "noreply@claude-env.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "llama-cpp-python>=0.2.0",
    "lancedb>=0.7.0",
    "pyarrow>=14.0",
    "onnxruntime>=1.16",
    "mcp>=1.0",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.6",
    "types-PyYAML>=6.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.entry-points]
console_scripts = [
    "claude-env = claudenv.cli:cli",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["claudenv*"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["claudenv/tests"]
asyncio_mode = "auto"