<svg width="100%" viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RAG indexing pipeline</title>
<desc>A left-to-right flowchart: a source file is chunked by chunk_file() using a strategy chosen by extension (AST-aware for code, header-split for markdown, sliding window as fallback); each Chunk is embedded by LlamaEmbedder into a normalized vector; the vector plus chunk metadata is upserted into a per-(repo,branch) LanceDB table keyed by chunk_id, which also maintains a full-text index for hybrid search.</desc>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: source file -->
<rect x="20" y="40" width="150" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="95" y="64" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Source file</text>
<text x="95" y="82" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">policy-allowed path</text>
<line x1="170" y1="70" x2="200" y2="70" class="edge" marker-end="url(#a1)"/>

<!-- Step 2: chunk_file -->
<rect x="200" y="20" width="200" height="100" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="300" y="42" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">chunk_file(path, text)</text>
<text x="300" y="62" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.py/.ts/.go/... -&gt; AST units</text>
<text x="300" y="78" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.md/.mdx/.rst -&gt; header split</text>
<text x="300" y="94" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">other -&gt; sliding window</text>
<line x1="400" y1="70" x2="430" y2="70" class="edge" marker-end="url(#a1)"/>

<!-- Step 3: Chunk list -->
<rect x="430" y="40" width="150" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="505" y="64" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">list[Chunk]</text>
<text x="505" y="82" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">text + metadata</text>
<line x1="505" y1="100" x2="505" y2="130" class="edge" marker-end="url(#a1)"/>

<!-- Step 4: LlamaEmbedder -->
<rect x="405" y="130" width="200" height="90" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="505" y="152" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">LlamaEmbedder</text>
<text x="505" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">embed_documents(texts)</text>
<text x="505" y="186" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">llama.cpp create_embedding</text>
<text x="505" y="202" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">+ L2 normalize</text>
<line x1="505" y1="220" x2="505" y2="250" class="edge" marker-end="url(#a1)"/>

<!-- Step 5: vector rows -->
<rect x="430" y="250" width="150" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="505" y="274" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">vector(768) rows</text>
<text x="505" y="292" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">chunk_id + metadata</text>
<line x1="505" y1="310" x2="505" y2="340" class="edge" marker-end="url(#a1)"/>

<!-- Step 6: LanceStore.upsert -->
<rect x="330" y="340" width="350" height="100" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="505" y="362" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">LanceStore.upsert(repo, branch, rows)</text>
<text x="505" y="380" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">delete-then-add, keyed by chunk_id</text>
<text x="505" y="396" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">table: &lt;repo-slug&gt;__&lt;branch&gt;.lance</text>
<text x="505" y="412" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">create_fts_index("text") maintained</text>
<line x1="330" y1="390" x2="200" y2="390" class="edge" marker-end="url(#a1)"/>

<!-- Side: on disk -->
<rect x="20" y="355" width="180" height="70" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="110" y="376" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">~/.claude-env/knowledge/</text>
<text x="110" y="394" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">lancedb/&lt;slug&gt;__&lt;branch&gt;</text>
<text x="110" y="410" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">local disk only, no egress</text>

<text x="380" y="450" text-anchor="middle" class="s" fill="rgb(95,94,90)">One table per (repo, branch); upsert is idempotent because chunk_id is a stable hash of (repo, path, start, end).</text>
</svg>
