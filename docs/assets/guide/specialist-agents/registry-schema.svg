<svg width="100%" viewBox="0 0 760 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>agent_registry.yaml schema: defaults anchor merged into per-agent overrides</title>
<desc>Diagram of how agent_registry.yaml's defaults block (a YAML anchor) is merged into
each of the 11 agent entries via the &lt;&lt;: *defaults merge key. The merge is shallow:
memory_access, rag_access, and requires_approval are simple scalar/list overrides, but
denied_tools is fully replaced rather than extended when an agent declares its own list.
Three consumer modules — task_router.py, approval_gate.py, and agent_handoff.py — each
independently parse the resulting merged document with yaml.safe_load, reading only the
fields relevant to their own job.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 11px; font-family: "SF Mono", "Menlo", monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- defaults block -->
<rect x="220" y="10" width="320" height="110" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">defaults: &amp;defaults</text>
<text x="380" y="50" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(83,74,183)">memory_access: [read]</text>
<text x="380" y="66" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(83,74,183)">rag_access: read</text>
<text x="380" y="82" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(83,74,183)">requires_approval: false</text>
<text x="380" y="98" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(83,74,183)">denied_tools: [exec_unrestricted,</text>
<text x="380" y="112" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(83,74,183)">write_outside_scope]</text>

<line x1="380" y1="120" x2="380" y2="150" class="edge" marker-end="url(#a3)"/>
<text x="470" y="138" text-anchor="middle" class="s" fill="rgb(95,94,90)">&lt;&lt;: *defaults (shallow merge)</text>

<!-- merged per-agent row: 3 examples -->
<rect x="30" y="150" width="220" height="150" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="140" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">frontend</text>
<text x="140" y="190" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">write_paths: src/**, ui/**,</text>
<text x="140" y="204" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">pages/**, components/**</text>
<text x="140" y="224" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">memory_access: [read]</text>
<text x="140" y="240" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">(kept from defaults)</text>
<text x="140" y="260" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">denied_tools: [write_</text>
<text x="140" y="274" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(30,90,61)">outside_scope] only</text>
<text x="140" y="288" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">requires_approval: false</text>

<rect x="270" y="150" width="220" height="150" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">devops</text>
<text x="380" y="190" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">write_paths: .github/**,</text>
<text x="380" y="204" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">infra/**, deploy/**, *.tf</text>
<text x="380" y="224" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">memory_access: [read]</text>
<text x="380" y="240" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">(kept from defaults)</text>
<text x="380" y="260" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">denied_tools: [exec_</text>
<text x="380" y="274" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(113,43,19)">unrestricted] only</text>
<text x="380" y="288" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)" font-weight="600">requires_approval: TRUE</text>

<rect x="510" y="150" width="220" height="150" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="620" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">security</text>
<text x="620" y="190" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(68,68,65)">write_paths: (none)</text>
<text x="620" y="206" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">-&gt; always out-of-scope</text>
<text x="620" y="226" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(68,68,65)">memory_access: [read,write]</text>
<text x="620" y="242" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">(overridden)</text>
<text x="620" y="262" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(68,68,65)">denied_tools: [write, exec,</text>
<text x="620" y="276" text-anchor="middle" dominant-baseline="central" class="m" fill="rgb(68,68,65)">exec_unrestricted]</text>
<text x="620" y="288" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">requires_approval: false</text>

<line x1="140" y1="300" x2="140" y2="330" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="300" x2="380" y2="330" class="edge" marker-end="url(#a3)"/>
<line x1="620" y1="300" x2="620" y2="330" class="edge" marker-end="url(#a3)"/>
<line x1="140" y1="330" x2="620" y2="330" class="edge"/>
<line x1="380" y1="330" x2="380" y2="352" class="edge" marker-end="url(#a3)"/>

<!-- merged document -->
<rect x="230" y="352" width="300" height="46" rx="8" fill="rgb(255,255,255)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="375" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">merged agent_registry.yaml document</text>

<line x1="380" y1="398" x2="380" y2="420" class="edge" marker-end="url(#a3)"/>

<!-- three independent readers -->
<rect x="60" y="420" width="200" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="160" y="442" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">task_router.py</text>
<text x="160" y="460" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">reads write_paths</text>
<text x="160" y="475" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">for routing signal</text>

<rect x="280" y="420" width="200" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="442" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">approval_gate.py</text>
<text x="380" y="460" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">reads requires_approval,</text>
<text x="380" y="475" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">write_paths, denied_tools</text>

<rect x="500" y="420" width="200" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="600" y="442" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">agent_handoff.py</text>
<text x="600" y="460" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">reads agent config</text>
<text x="600" y="475" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">for handoff context</text>

<line x1="380" y1="398" x2="160" y2="420" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="398" x2="600" y2="420" class="edge" marker-end="url(#a3)"/>

<text x="380" y="520" text-anchor="middle" class="s" fill="rgb(95,94,90)">Each of the 3 consumers calls yaml.safe_load() independently — there is no shared</text>
<text x="380" y="536" text-anchor="middle" class="s" fill="rgb(95,94,90)">AgentRegistry loader class. global_approval_gates (bottom of the file) is loaded by</text>
<text x="380" y="552" text-anchor="middle" class="s" fill="rgb(95,94,90)">approval_gate.py but never iterated — its 5 conditions are hand-coded separately.</text>
<text x="380" y="580" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: an agent overriding denied_tools REPLACES the defaults' list, it does not extend it.</text>
</svg>
