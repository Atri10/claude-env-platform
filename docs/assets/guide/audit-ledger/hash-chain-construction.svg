<svg width="100%" viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Audit event hash-chain construction</title>
<desc>Three sequential audit events, each showing how its event_hash is computed as sha256(prev_hash concatenated with the canonical JSON of its own payload). Event 1 uses the literal string GENESIS as its prev_hash since no row precedes it. Each event's event_hash becomes the next event's prev_hash column value, forming a chain. An arrow shows that event_hash is stored and then read back as prev_hash by the following insert.</desc>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 10.5px; font-family: "SF Mono", "Menlo", monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
  .chain { fill: none; stroke: rgb(83,74,183); stroke-width: 2px; }
</style>

<!-- Event 1 -->
<rect x="20" y="40" width="220" height="150" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="130" y="62" text-anchor="middle" class="t" fill="rgb(60,52,137)">event_id = 1</text>
<text x="34" y="86" class="m" fill="rgb(60,52,137)">prev_hash =</text>
<text x="34" y="100" class="m" fill="rgb(113,43,19)">"GENESIS"</text>
<text x="34" y="122" class="m" fill="rgb(60,52,137)">canon = canonical_json(</text>
<text x="44" y="136" class="m" fill="rgb(60,52,137)">{ts, event_type, actor,</text>
<text x="44" y="150" class="m" fill="rgb(60,52,137)">session_id, repo, tier, body})</text>
<text x="34" y="172" class="m" fill="rgb(30,90,61)">event_hash = sha256(</text>
<text x="44" y="184" class="m" fill="rgb(30,90,61)">prev_hash + canon)</text>

<!-- Event 2 -->
<rect x="270" y="40" width="220" height="150" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="62" text-anchor="middle" class="t" fill="rgb(60,52,137)">event_id = 2</text>
<text x="284" y="86" class="m" fill="rgb(60,52,137)">prev_hash =</text>
<text x="284" y="100" class="m" fill="rgb(30,90,61)">event_1.event_hash</text>
<text x="284" y="122" class="m" fill="rgb(60,52,137)">canon = canonical_json(</text>
<text x="294" y="136" class="m" fill="rgb(60,52,137)">{ts, event_type, actor,</text>
<text x="294" y="150" class="m" fill="rgb(60,52,137)">session_id, repo, tier, body})</text>
<text x="284" y="172" class="m" fill="rgb(30,90,61)">event_hash = sha256(</text>
<text x="294" y="184" class="m" fill="rgb(30,90,61)">prev_hash + canon)</text>

<!-- Event 3 -->
<rect x="520" y="40" width="220" height="150" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="630" y="62" text-anchor="middle" class="t" fill="rgb(60,52,137)">event_id = 3</text>
<text x="534" y="86" class="m" fill="rgb(60,52,137)">prev_hash =</text>
<text x="534" y="100" class="m" fill="rgb(30,90,61)">event_2.event_hash</text>
<text x="534" y="122" class="m" fill="rgb(60,52,137)">canon = canonical_json(</text>
<text x="544" y="136" class="m" fill="rgb(60,52,137)">{ts, event_type, actor,</text>
<text x="544" y="150" class="m" fill="rgb(60,52,137)">session_id, repo, tier, body})</text>
<text x="534" y="172" class="m" fill="rgb(30,90,61)">event_hash = sha256(</text>
<text x="544" y="184" class="m" fill="rgb(30,90,61)">prev_hash + canon)</text>

<!-- chain arrows -->
<line x1="240" y1="100" x2="270" y2="100" class="chain" marker-end="url(#a1)"/>
<line x1="490" y1="100" x2="520" y2="100" class="chain" marker-end="url(#a1)"/>
<text x="255" y="90" text-anchor="middle" class="s" fill="rgb(83,74,183)">stored as</text>
<text x="505" y="90" text-anchor="middle" class="s" fill="rgb(83,74,183)">stored as</text>

<!-- BEGIN IMMEDIATE note -->
<rect x="20" y="215" width="720" height="55" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="235" text-anchor="middle" class="t" fill="rgb(68,68,65)">_append() reads the current tip and inserts inside one BEGIN IMMEDIATE transaction</text>
<text x="380" y="253" text-anchor="middle" class="s" fill="rgb(95,94,90)">so two concurrent processes can't both read event 2 as "tip" and fork the chain by both writing event 3</text>

<!-- tamper section -->
<rect x="20" y="295" width="720" height="150" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="318" text-anchor="middle" class="t" fill="rgb(113,43,19)">If event 2's payload_json is altered after the fact</text>
<text x="40" y="344" class="s" fill="rgb(113,43,19)">1. sha256(event_1.event_hash + altered_canon) no longer equals the stored event_2.event_hash</text>
<text x="40" y="364" class="s" fill="rgb(113,43,19)">2. verify_chain() recomputes hash-by-hash from GENESIS and reports first_broken_event_id = 2</text>
<text x="40" y="384" class="s" fill="rgb(113,43,19)">3. event_3's prev_hash still points to the ORIGINAL event_2.event_hash — it doesn't match either</text>
<text x="40" y="404" class="s" fill="rgb(113,43,19)">4. UPDATE/DELETE on audit_events is blocked outright by BEFORE UPDATE/DELETE triggers (SQLite RAISE(ABORT))</text>
<text x="40" y="424" class="s" fill="rgb(113,43,19)">so the only way to remove a row is dropping the whole table — which restarts the chain at GENESIS with 0 length,</text>
<text x="40" y="438" class="s" fill="rgb(113,43,19)">itself a detectable discontinuity in compliance_report.py's total_events count.</text>
</svg>
