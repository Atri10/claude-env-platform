<svg width="100%" viewBox="0 0 760 900" role="img" xmlns="http://www.w3.org/2000/svg">
<title>incident on / off sequence</title>
<desc>Two vertical sequences. The left/top sequence shows `claude-env incident on`: an operator command writes the JSON INCIDENT marker file first (enforcement begins immediately), then denies every pending human approval, snapshots the SQLite database to archive/, and writes a critical security_event to the audit ledger; a side branch shows every policy_engine.evaluate_path call across all enforcement surfaces now returning block. The bottom sequence shows `claude-env incident off`: the marker is deleted, a high-severity security_event records the lift, and evaluate_path calls return to normal allow/deny logic.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .h { font-size: 13px; font-weight: 600; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<text x="30" y="24" class="h" fill="rgb(68,68,65)">claude-env incident on --reason "..." --by who</text>

<!-- Step 1: operator command -->
<rect x="30" y="38" width="700" height="44" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="60" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">operator runs incident.py on (bin/claude-env dispatches by venv python)</text>
<line x1="380" y1="82" x2="380" y2="104" class="edge" marker-end="url(#a3)"/>

<!-- Step 2: write marker (rust - this is the moment enforcement flips) -->
<rect x="30" y="104" width="700" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="124" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">1. write $CLAUDE_ENV_HOME/state/INCIDENT (JSON: ts, by, reason)</text>
<text x="380" y="142" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">enforcement begins the instant this file exists &#8212; before any bookkeeping below runs</text>
<line x1="740" y1="132" x2="740" y2="132"/>
<line x1="640" y1="132" x2="700" y2="132" class="edge" marker-end="url(#a3)" />
<line x1="380" y1="160" x2="380" y2="182" class="edge" marker-end="url(#a3)"/>

<!-- side branch to every evaluate_path call -->
<rect x="580" y="200" width="150" height="60" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="655" y="220" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">every</text>
<text x="655" y="235" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">evaluate_path()</text>
<text x="655" y="249" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">&#8594; block, rule="incident"</text>
<line x1="640" y1="140" x2="655" y2="200" class="edge" marker-end="url(#a3)"/>

<!-- Step 3: deny pending approvals -->
<rect x="30" y="182" width="500" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="280" y="202" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">2. deny every pending human_approvals row</text>
<text x="280" y="219" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">ApprovalGate.list_open() &#8594; AuditLogger.human_approval_resolve(..., "incident:&lt;by&gt;")</text>
<line x1="280" y1="232" x2="280" y2="254" class="edge" marker-end="url(#a3)"/>

<!-- Step 4: snapshot db -->
<rect x="30" y="254" width="500" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="280" y="274" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">3. snapshot SQLite DB (online, WAL-safe)</text>
<text x="280" y="291" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">sqlite3 .backup() &#8594; archive/incident-&lt;ts&gt;.db (skipped for non-sqlite DSNs)</text>
<line x1="280" y1="304" x2="280" y2="326" class="edge" marker-end="url(#a3)"/>

<!-- Step 5: audit event -->
<rect x="30" y="326" width="500" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="280" y="346" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">4. log critical security_event to the ledger</text>
<text x="280" y="363" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">category="incident", includes approvals_denied count + snapshot path</text>

<rect x="30" y="392" width="500" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="280" y="415" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(68,68,65)">steps 2-4 wrapped in try/except: if bookkeeping raises, the marker</text>
<text x="280" y="429" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(68,68,65)">from step 1 already stands &#8212; enforcement holds regardless</text>

<line x1="380" y1="438" x2="380" y2="470" class="edge" marker-end="url(#a3)"/>

<!-- divider -->
<line x1="30" y1="490" x2="730" y2="490" stroke="rgb(200,198,192)" stroke-width="1" stroke-dasharray="4 3"/>

<text x="30" y="518" class="h" fill="rgb(68,68,65)">claude-env incident off --by who</text>

<!-- lift step 1: remove marker -->
<rect x="30" y="532" width="500" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="280" y="552" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">1. delete state/INCIDENT (no-op, prints status, if already absent)</text>
<text x="280" y="569" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">policy enforcement reverts to normal allow/deny rules immediately</text>
<line x1="280" y1="582" x2="280" y2="604" class="edge" marker-end="url(#a3)"/>

<!-- lift step 2: audit -->
<rect x="30" y="604" width="500" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="280" y="624" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">2. log high-severity security_event: "incident mode LIFTED by &lt;by&gt;"</text>
<text x="280" y="641" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">includes the marker's original JSON body (ts/by/reason) as "was: ..."</text>

<!-- side effect box -->
<rect x="580" y="532" width="150" height="60" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="655" y="552" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">every</text>
<text x="655" y="567" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">evaluate_path()</text>
<text x="655" y="581" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">&#8594; normal logic</text>
<line x1="530" y1="552" x2="580" y2="552" class="edge" marker-end="url(#a3)"/>

<text x="380" y="690" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: the marker's existence is the only thing evaluate_path() checks &#8212; approvals</text>
<text x="380" y="706" text-anchor="middle" class="s" fill="rgb(95,94,90)">denial, DB snapshot, and audit logging are best-effort bookkeeping around that one fact.</text>
</svg>
