<svg width="100%" viewBox="0 0 760 1040" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Approval gate decision flow</title>
<desc>An agent action is evaluated by ApprovalGate.evaluate() against six independent trigger conditions. If none fire, the action proceeds automatically. If any fire, ApprovalGate.open() writes a pending human_approvals row via AuditLogger, a best-effort macOS notification fires, and the approvals web UI is opened. The caller (e.g. terminal.run) then blocks, polling the database, until an operator approves or denies via the UI or CLI, or the wait times out. The resolution is written back to the same audit-logged human_approvals row.</desc>
<defs>
<marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: action proposed -->
<rect x="220" y="10" width="320" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="28" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Agent proposes an action</text>
<text x="380" y="44" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">gate.evaluate(agent, action, target)</text>
<line x1="380" y1="56" x2="380" y2="78" class="edge" marker-end="url(#a4)"/>

<!-- Step 2: gate conditions box -->
<rect x="140" y="78" width="480" height="180" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="98" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Gate fires if ANY reason is appended</text>
<text x="160" y="118" class="s" fill="rgb(83,74,183)">• registry: agents.&lt;agent&gt;.requires_approval == true</text>
<text x="160" y="134" class="s" fill="rgb(83,74,183)">• tier is not None and tier &gt;= 2 (all actions gated)</text>
<text x="160" y="150" class="s" fill="rgb(83,74,183)">• write/delete/create action, target outside write_paths</text>
<text x="160" y="166" class="s" fill="rgb(83,74,183)">• action contains terminal.run/exec/deploy/apply</text>
<text x="160" y="182" class="s" fill="rgb(83,74,183)">• action or target matches a git-rewrite substring</text>
<text x="160" y="198" class="s" fill="rgb(83,74,183)">  (git push, commit --amend, rebase, reset --hard)</text>
<text x="160" y="214" class="s" fill="rgb(83,74,183)">• action contains memory.delete / memory.prune</text>
<text x="160" y="230" class="s" fill="rgb(83,74,183)">• action matches a denied_tools fnmatch pattern</text>
<text x="160" y="248" class="s" fill="rgb(60,52,137)" font-style="italic">GateVerdict.required = bool(reasons)</text>
<line x1="380" y1="258" x2="380" y2="280" class="edge" marker-end="url(#a4)"/>

<!-- Decision diamond text (branch) -->
<text x="380" y="272" text-anchor="middle" class="s" fill="rgb(95,94,90)">required?</text>
<line x1="540" y1="167" x2="660" y2="167" class="edge" marker-end="url(#a4)"/>
<rect x="660" y="142" width="80" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="700" y="162" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">no -></text>
<text x="700" y="178" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">auto-run</text>

<!-- Step 3: open pending approval -->
<rect x="220" y="280" width="320" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="300" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">gate.open(verdict)</text>
<text x="380" y="318" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">AuditLogger.human_approval_request() writes</text>
<text x="380" y="332" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">human_approvals row, decision='pending'</text>
<line x1="380" y1="336" x2="380" y2="358" class="edge" marker-end="url(#a4)"/>

<!-- Step 4: notify + open UI -->
<rect x="140" y="358" width="230" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="255" y="378" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">_notify() (macOS only)</text>
<text x="255" y="396" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">osascript display notification</text>
<text x="255" y="410" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">best-effort, swallows errors</text>

<rect x="390" y="358" width="230" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="505" y="378" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">_open_approvals_ui()</text>
<text x="505" y="396" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">reuse or spawn approvals_ui.py,</text>
<text x="505" y="410" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">open the discovered port via `open`/`xdg-open`</text>
<line x1="380" y1="418" x2="380" y2="440" class="edge" marker-end="url(#a4)"/>

<!-- Step 5: block/poll -->
<rect x="180" y="440" width="400" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="460" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">Caller blocks: _await_decision(req_id)</text>
<text x="380" y="478" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">polls human_approvals every 2s (_POLL_S)</text>
<text x="380" y="494" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">up to CLAUDE_ENV_APPROVAL_WAIT_S (default 120s)</text>
<line x1="380" y1="510" x2="380" y2="532" class="edge" marker-end="url(#a4)"/>

<!-- Step 6: human decides via UI -->
<rect x="220" y="532" width="320" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="552" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">Operator clicks Approve / Deny</text>
<text x="380" y="570" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">approvals_ui.py POST /resolve (CSRF token checked)</text>
<line x1="380" y1="588" x2="380" y2="610" class="edge" marker-end="url(#a4)"/>

<!-- Step 7: resolve -->
<rect x="220" y="610" width="320" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="628" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">gate.resolve(req_id, approved, decided_by)</text>
<text x="380" y="646" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">decided_by = OS user@host, auto-recorded</text>
<text x="380" y="660" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">AuditLogger.human_approval_resolve() UPDATEs the row</text>
<line x1="380" y1="666" x2="380" y2="688" class="edge" marker-end="url(#a4)"/>

<!-- Step 8: three outcomes -->
<rect x="80" y="688" width="200" height="70" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="180" y="710" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">approved</text>
<text x="180" y="728" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">command runs in the</text>
<text x="180" y="742" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">same argv-only sandbox</text>

<rect x="290" y="688" width="200" height="70" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="390" y="710" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">denied</text>
<text x="390" y="728" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">command is NOT run;</text>
<text x="390" y="742" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">reason returned to caller</text>

<rect x="500" y="688" width="200" height="70" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="600" y="710" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">timeout / pending</text>
<text x="600" y="728" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">row stays 'pending';</text>
<text x="600" y="742" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">retry the ask later</text>

<line x1="330" y1="666" x2="180" y2="688" class="edge" marker-end="url(#a4)"/>
<line x1="380" y1="666" x2="390" y2="688" class="edge" marker-end="url(#a4)"/>
<line x1="430" y1="666" x2="600" y2="688" class="edge" marker-end="url(#a4)"/>

<text x="380" y="790" text-anchor="middle" class="s" fill="rgb(95,94,90)">Both the request and the resolution are hash-chained audit_events; human_approvals is a same-transaction projection.</text>
<text x="380" y="806" text-anchor="middle" class="s" fill="rgb(95,94,90)">The gate never runs anything itself — it only decides whether the caller may proceed automatically.</text>
</svg>
