<svg width="100%" viewBox="0 0 760 980" role="img" xmlns="http://www.w3.org/2000/svg">
<title>evaluate_path() evaluation order</title>
<desc>A vertical flowchart of the eight ordered steps PolicyEngine.evaluate_path performs for a single path: incident mode check, path normalization, override-deny escape hatch, global deny rules, repo deny rules, repo allow rules, tier default, and finally a separate content-scan pass performed by the caller after an allow decision. Each deny-capable step has a side branch immediately returning a block decision, illustrating that deny always wins and evaluation stops at the first match.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1 -->
<rect x="220" y="10" width="320" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">1. Incident mode check</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">marker file exists?</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#a3)"/>
<line x1="540" y1="35" x2="640" y2="35" class="edge" marker-end="url(#a3)"/>
<rect x="640" y="10" width="100" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="35" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">block</text>

<!-- Step 2 -->
<rect x="220" y="82" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">2. Normalize path</text>
<text x="380" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">strip ./ and leading /, backslash&#8594;slash</text>
<line x1="380" y1="132" x2="380" y2="154" class="edge" marker-end="url(#a3)"/>

<!-- Step 3 -->
<rect x="220" y="154" width="320" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="174" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">3. Override-deny escape hatch</text>
<text x="380" y="192" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">repo.override_paths match?</text>
<line x1="540" y1="179" x2="640" y2="179" class="edge" marker-end="url(#a3)"/>
<rect x="640" y="154" width="100" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="690" y="179" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">allow</text>
<text x="690" y="196" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">(scan still runs)</text>
<line x1="380" y1="204" x2="380" y2="226" class="edge" marker-end="url(#a3)"/>

<!-- Step 4 -->
<rect x="220" y="226" width="320" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="246" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">4. Global deny rules</text>
<text x="380" y="264" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">paths &#8594; extensions &#8594; regex</text>
<line x1="540" y1="251" x2="640" y2="251" class="edge" marker-end="url(#a3)"/>
<rect x="640" y="226" width="100" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="251" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">block</text>
<line x1="380" y1="276" x2="380" y2="298" class="edge" marker-end="url(#a3)"/>

<!-- Step 5 -->
<rect x="220" y="298" width="320" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="318" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">5. Repo deny rules</text>
<text x="380" y="336" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">incl. tier-merged extra_deny_*</text>
<line x1="540" y1="323" x2="640" y2="323" class="edge" marker-end="url(#a3)"/>
<rect x="640" y="298" width="100" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="323" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">block</text>
<line x1="380" y1="348" x2="380" y2="370" class="edge" marker-end="url(#a3)"/>

<!-- Step 6 -->
<rect x="220" y="370" width="320" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="390" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">6. Repo allow rules</text>
<text x="380" y="408" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">allow_paths OR allow_ext match?</text>
<line x1="540" y1="395" x2="640" y2="395" class="edge" marker-end="url(#a3)"/>
<rect x="640" y="370" width="100" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="690" y="395" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">allow</text>
<line x1="380" y1="420" x2="380" y2="442" class="edge" marker-end="url(#a3)"/>

<!-- Step 7 -->
<rect x="180" y="442" width="400" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="462" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">7. Tier default</text>
<text x="380" y="480" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">tier 3: default_deny=true &#8594; block</text>
<text x="380" y="495" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">tier 0-2: fall through &#8594; allow</text>
<line x1="380" y1="502" x2="380" y2="530" class="edge" marker-end="url(#a3)"/>

<!-- Step 8 -->
<rect x="140" y="530" width="480" height="60" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="552" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">8. scan_content() — caller's separate pass</text>
<text x="380" y="570" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">only runs after an "allow" — stricter mode (block) wins if either policy says block</text>

<text x="380" y="640" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: the first matching deny step returns immediately — no fallthrough past a block.</text>
</svg>
