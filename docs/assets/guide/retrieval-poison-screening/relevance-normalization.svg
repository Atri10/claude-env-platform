<svg width="100%" viewBox="0 0 720 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>_relevance() score normalization</title>
<desc>A decision diagram showing how _relevance() normalizes three possible candidate score fields into one higher-is-better float: rerank_score is used as-is and takes priority, otherwise _relevance_score (LanceDB hybrid RRF) is used as-is, otherwise _distance (vector-only cosine distance, lower is better) is negated, otherwise 0.0 is returned. This lets one sort key work whether or not the reranker ran and whether hybrid or vector-only search was used.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<rect x="260" y="10" width="200" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="360" y="33" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">candidate dict c</text>
<line x1="360" y1="56" x2="360" y2="78" class="edge" marker-end="url(#a3)"/>

<!-- check 1 -->
<rect x="230" y="78" width="260" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="360" y="98" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">rerank_score is not None?</text>
<text x="360" y="115" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">cross-encoder, higher = better</text>
<line x1="490" y1="103" x2="590" y2="103" class="edge" marker-end="url(#a3)"/>
<rect x="590" y="78" width="120" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="650" y="98" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">return</text>
<text x="650" y="115" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">rerank_score</text>
<line x1="360" y1="128" x2="360" y2="150" class="edge" marker-end="url(#a3)"/>

<!-- check 2 -->
<rect x="230" y="150" width="260" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="360" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">_relevance_score is not None?</text>
<text x="360" y="187" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">LanceDB hybrid RRF, higher = better</text>
<line x1="490" y1="175" x2="590" y2="175" class="edge" marker-end="url(#a3)"/>
<rect x="590" y="150" width="120" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="650" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">return</text>
<text x="650" y="187" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">_relevance_score</text>
<line x1="360" y1="200" x2="360" y2="222" class="edge" marker-end="url(#a3)"/>

<!-- check 3 -->
<rect x="230" y="222" width="260" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="360" y="242" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">_distance is not None?</text>
<text x="360" y="259" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">vector-only cosine distance, lower = better</text>
<line x1="490" y1="247" x2="590" y2="247" class="edge" marker-end="url(#a3)"/>
<rect x="590" y="222" width="120" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="650" y="242" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">return</text>
<text x="650" y="259" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">-_distance</text>
<line x1="360" y1="272" x2="360" y2="294" class="edge" marker-end="url(#a3)"/>

<!-- fallback -->
<rect x="260" y="294" width="200" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="360" y="314" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">return 0.0</text>
<text x="360" y="331" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">no score field present</text>

<text x="360" y="400" text-anchor="middle" class="s" fill="rgb(95,94,90)">Regression fixed by this helper: the old sort key read only rerank_score/_distance,</text>
<text x="360" y="418" text-anchor="middle" class="s" fill="rgb(95,94,90)">so hybrid-path _relevance_score was ignored and vector-only order was inverted.</text>
</svg>
