<svg width="100%" viewBox="0 0 760 1060" role="img" xmlns="http://www.w3.org/2000/svg">
<title>_inspect_bash() decision precedence</title>
<desc>A vertical flowchart of the six ordered checks hooks/policy_hook.py's _inspect_bash performs on a parsed Bash command: destructive/state-mutating command, control-plane write target, policy-denied file argument, network egress combined with a file argument (exfiltration), plain network egress (tiered), and an inline secret pattern in the command string. Each step short-circuits to a deny or ask decision; only a command that clears all six falls through to silent allow.</desc>
<defs>
<marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Entry -->
<rect x="220" y="10" width="320" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="28" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Bash command string</text>
<text x="380" y="44" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">tokenized via _shell_tokens() (shlex + punctuation_chars)</text>
<line x1="380" y1="56" x2="380" y2="78" class="edge" marker-end="url(#b1)"/>

<!-- Step 0: mutating -->
<rect x="200" y="78" width="360" height="52" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="98" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">0. _mutating_reason() match?</text>
<text x="380" y="116" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">rm/chmod/kill/dd… or git push/reset/rebase/clean/commit --amend</text>
<line x1="560" y1="104" x2="660" y2="104" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="79" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="99" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="115" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">hard, any path</text>
<line x1="380" y1="130" x2="380" y2="152" class="edge" marker-end="url(#b1)"/>

<!-- Step 0b: control-plane write -->
<rect x="200" y="152" width="360" height="60" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="170" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">0b. control-plane write target?</text>
<text x="380" y="188" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">_bash_write_targets() ∩ _is_control_plane()</text>
<text x="380" y="203" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">unless matched by repo override_deny</text>
<line x1="560" y1="182" x2="660" y2="182" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="157" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="177" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="193" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">reads still allowed</text>
<line x1="380" y1="212" x2="380" y2="234" class="edge" marker-end="url(#b1)"/>

<!-- Step 1: policy-denied file arg -->
<rect x="200" y="234" width="360" height="58" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="253" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">1. file argument policy-blocked?</text>
<text x="380" y="271" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">_bash_candidates() paths, each run through</text>
<text x="380" y="286" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">PolicyEngine.evaluate_path() — see policy-engine.md</text>
<line x1="560" y1="263" x2="660" y2="263" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="238" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="258" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="274" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">hard</text>
<line x1="380" y1="292" x2="380" y2="314" class="edge" marker-end="url(#b1)"/>

<!-- Step 2: exfiltration -->
<rect x="200" y="314" width="360" height="52" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="333" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">2. network cmd AND a file argument?</text>
<text x="380" y="351" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">e.g. curl -d @src/app.py — likely exfiltration</text>
<line x1="560" y1="340" x2="660" y2="340" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="315" width="90" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="335" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="351" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">any tier</text>
<line x1="380" y1="366" x2="380" y2="388" class="edge" marker-end="url(#b1)"/>

<!-- Step 3: plain network egress -->
<rect x="180" y="388" width="400" height="66" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="406" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">3. plain network egress (no file arg)?</text>
<text x="380" y="424" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">tier &#8805; 2 &#8594; deny (network disabled at that tier)</text>
<text x="380" y="439" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">tier &#8804; 1 &#8594; ask (operator confirms)</text>
<line x1="580" y1="412" x2="660" y2="412" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="388" width="90" height="30" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="705" y="403" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">deny</text>
<text x="705" y="415" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">tier&#8805;2</text>
<rect x="660" y="424" width="90" height="30" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="705" y="439" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">ask</text>
<text x="705" y="450" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">tier&#8804;1</text>
<line x1="380" y1="454" x2="380" y2="476" class="edge" marker-end="url(#b1)"/>

<!-- Step 4: secret in command string -->
<rect x="200" y="476" width="360" height="52" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="495" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">4. secret pattern in command string?</text>
<text x="380" y="513" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">security.detectors.SECRET_PATTERNS, re.search on raw command</text>
<line x1="560" y1="502" x2="660" y2="502" class="edge" marker-end="url(#b1)"/>
<rect x="660" y="477" width="90" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="705" y="497" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">ask</text>
<text x="705" y="513" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">confirm</text>
<line x1="380" y1="528" x2="380" y2="550" class="edge" marker-end="url(#b1)"/>

<!-- Allow -->
<rect x="240" y="550" width="280" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="570" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">allow, silently</text>
<text x="380" y="587" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">_inspect_bash() returns None</text>

<text x="380" y="650" text-anchor="middle" class="s" fill="rgb(95,94,90)">Precedence is fixed in code order: a destructive command denies even if it also</text>
<text x="380" y="668" text-anchor="middle" class="s" fill="rgb(95,94,90)">touches a denied path or does network I/O — the first matching check wins.</text>

<!-- Legend -->
<rect x="130" y="710" width="500" height="200" rx="10" fill="none" stroke="rgb(200,198,190)" stroke-width="1"/>
<text x="150" y="732" class="t" fill="rgb(68,68,65)">Notes on scope</text>
<rect x="150" y="748" width="16" height="16" rx="4" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="175" y="761" class="s" fill="rgb(95,94,90)">hard deny — command never runs, no operator override</text>
<rect x="150" y="774" width="16" height="16" rx="4" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="175" y="787" class="s" fill="rgb(95,94,90)">ask — surfaced to the operator for confirmation</text>
<rect x="150" y="800" width="16" height="16" rx="4" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="175" y="813" class="s" fill="rgb(95,94,90)">allow — no hookSpecificOutput printed at all</text>
<rect x="150" y="826" width="16" height="16" rx="4" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="175" y="839" class="s" fill="rgb(95,94,90)">tier-conditional — outcome depends on repo.tier</text>
<text x="150" y="866" class="s" fill="rgb(95,94,90)">Step 1's file-argument check delegates entirely to PolicyEngine.evaluate_path()</text>
<text x="150" y="882" class="s" fill="rgb(95,94,90)">(paths/extensions/regex, tiers, override_deny) — see policy-engine.md, not this doc.</text>
</svg>
