<svg width="100%" viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tier resolution at compile time</title>
<desc>A table-style diagram showing the four privacy tiers, 0 through 3, each row listing whether RAG is enabled by default, whether memory is namespace-isolated, whether default-deny (whitelist) mode is active, and which extra deny extensions and paths that tier merges into the compiled repo policy. Tier 3 is visually distinguished as the only default-deny, whitelist-style tier.</desc>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .h { font-size: 12px; font-weight: 500; }
  .c { font-size: 11px; font-weight: 400; }
</style>

<text x="20" y="24" class="h" fill="rgb(68,68,65)">Tiers are resolved once, in PolicyEngine._compile(), and merged into the repo's CompiledPolicy</text>

<!-- header row -->
<rect x="20" y="44" width="720" height="34" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="55" y="61" class="h" fill="rgb(68,68,65)">tier</text>
<text x="140" y="61" class="h" fill="rgb(68,68,65)">rag_default</text>
<text x="255" y="61" class="h" fill="rgb(68,68,65)">memory_isolated</text>
<text x="400" y="61" class="h" fill="rgb(68,68,65)">default_deny</text>
<text x="520" y="61" class="h" fill="rgb(68,68,65)">extra_deny_ext / extra_deny_paths</text>

<!-- tier 0 -->
<rect x="20" y="78" width="720" height="80" fill="rgb(255,255,255)" stroke="rgb(95,94,90)" stroke-width="0.3"/>
<circle cx="45" cy="108" r="14" fill="rgb(233,244,236)" stroke="rgb(46,125,86)"/>
<text x="45" y="108" text-anchor="middle" dominant-baseline="central" class="h" fill="rgb(30,90,61)">0</text>
<text x="140" y="108" dominant-baseline="central" class="c" fill="rgb(68,68,65)">true</text>
<text x="255" y="108" dominant-baseline="central" class="c" fill="rgb(68,68,65)">false</text>
<text x="400" y="108" dominant-baseline="central" class="c" fill="rgb(68,68,65)">false</text>
<text x="520" y="98" dominant-baseline="central" class="c" fill="rgb(95,94,90)">(none)</text>
<text x="55" y="128" class="c" fill="rgb(95,94,90)">public</text>

<!-- tier 1 -->
<rect x="20" y="158" width="720" height="60" fill="rgb(250,250,248)" stroke="rgb(95,94,90)" stroke-width="0.3"/>
<circle cx="45" cy="188" r="14" fill="rgb(233,244,236)" stroke="rgb(46,125,86)"/>
<text x="45" y="188" text-anchor="middle" dominant-baseline="central" class="h" fill="rgb(30,90,61)">1</text>
<text x="140" y="188" dominant-baseline="central" class="c" fill="rgb(68,68,65)">true</text>
<text x="255" y="188" dominant-baseline="central" class="c" fill="rgb(68,68,65)">false</text>
<text x="400" y="188" dominant-baseline="central" class="c" fill="rgb(68,68,65)">false</text>
<text x="520" y="188" dominant-baseline="central" class="c" fill="rgb(95,94,90)">(none) — internal, default tier</text>

<!-- tier 2 -->
<rect x="20" y="218" width="720" height="90" fill="rgb(255,255,255)" stroke="rgb(95,94,90)" stroke-width="0.3"/>
<circle cx="45" cy="255" r="14" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="45" y="255" text-anchor="middle" dominant-baseline="central" class="h" fill="rgb(113,43,19)">2</text>
<text x="140" y="255" dominant-baseline="central" class="c" fill="rgb(68,68,65)">true</text>
<text x="255" y="255" dominant-baseline="central" class="c" fill="rgb(68,68,65)">true</text>
<text x="400" y="255" dominant-baseline="central" class="c" fill="rgb(68,68,65)">false</text>
<text x="520" y="240" class="c" fill="rgb(95,94,90)">ext: .sql .csv .parquet .db .dump</text>
<text x="520" y="258" class="c" fill="rgb(95,94,90)">paths: **/migrations/** **/fixtures/**</text>
<text x="520" y="276" class="c" fill="rgb(95,94,90)">**/seeds/**</text>
<text x="55" y="295" class="c" fill="rgb(95,94,90)">sensitive</text>

<!-- tier 3 -->
<rect x="20" y="308" width="720" height="90" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<circle cx="45" cy="345" r="14" fill="rgb(153,60,29)"/>
<text x="45" y="345" text-anchor="middle" dominant-baseline="central" class="h" fill="white">3</text>
<text x="140" y="345" dominant-baseline="central" class="c" fill="rgb(113,43,19)">false</text>
<text x="255" y="345" dominant-baseline="central" class="c" fill="rgb(113,43,19)">true</text>
<text x="400" y="345" dominant-baseline="central" class="h" fill="rgb(113,43,19)">true (whitelist)</text>
<text x="520" y="330" class="c" fill="rgb(113,43,19)">ext: adds .yaml .yml .json to tier-2 set</text>
<text x="520" y="348" class="c" fill="rgb(113,43,19)">paths: (none extra — allow_paths is</text>
<text x="520" y="365" class="c" fill="rgb(113,43,19)">now authoritative, not a blacklist)</text>
<text x="55" y="385" class="h" fill="rgb(113,43,19)">restricted</text>

<text x="20" y="430" class="c" fill="rgb(95,94,90)">Only tier 3 flips the model: tiers 0-2 are default-allow (deny is a blacklist); tier 3 is default-deny (allow_paths is a whitelist).</text>
</svg>
