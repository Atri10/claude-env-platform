<svg width="100%" viewBox="0 0 760 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>session_ingestor.py ingest pipeline</title>
<desc>A horizontal flowchart of the five stages ingest() performs per new transcript file: locate the JSONL transcript under ~/.claude/projects, parse it into a compact summary, redact secrets from the task and outcome text with SecretDetector.redact, create one episodic session memory node via MemoryManager.add_node, and record the node in session_ingest_state so the transcript is never re-ingested. A side note shows the already-ingested transcript being skipped via a dedupe check.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: transcript file -->
<rect x="20" y="40" width="150" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="95" y="62" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">1. Transcript</text>
<text x="95" y="80" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">~/.claude/projects/*/*.jsonl</text>
<line x1="170" y1="70" x2="192" y2="70" class="edge" marker-end="url(#a3)"/>

<!-- dedupe check branch -->
<rect x="20" y="130" width="150" height="50" rx="8" fill="rgb(245,244,241)" stroke="rgb(137,135,129)" stroke-width="1"/>
<text x="95" y="149" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(90,88,83)">session_ingest_state</text>
<text x="95" y="166" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(120,118,113)">already ingested? skip</text>
<line x1="95" y1="100" x2="95" y2="128" class="edge" marker-end="url(#a3)"/>

<!-- Step 2: parse -->
<rect x="192" y="40" width="150" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="267" y="62" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">2. Parse</text>
<text x="267" y="80" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">_parse_transcript()</text>
<line x1="342" y1="70" x2="364" y2="70" class="edge" marker-end="url(#a3)"/>

<!-- Step 3: redact secrets -->
<rect x="364" y="40" width="150" height="60" rx="8" fill="rgb(253,237,232)" stroke="rgb(178,66,42)" stroke-width="1"/>
<text x="439" y="58" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(140,52,33)">3. Redact secrets</text>
<text x="439" y="76" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(178,66,42)">SecretDetector.redact()</text>
<line x1="514" y1="70" x2="536" y2="70" class="edge" marker-end="url(#a3)"/>

<!-- Step 4: create episodic node -->
<rect x="536" y="40" width="200" height="60" rx="8" fill="rgb(228,242,231)" stroke="rgb(46,111,64)" stroke-width="1"/>
<text x="636" y="58" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,84,46)">4. Create episodic node</text>
<text x="636" y="76" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(46,111,64)">MemoryManager.add_node()</text>
<line x1="636" y1="100" x2="636" y2="122" class="edge" marker-end="url(#a3)"/>

<!-- Step 5: written to graph -->
<rect x="536" y="122" width="200" height="60" rx="8" fill="rgb(228,242,231)" stroke="rgb(46,111,64)" stroke-width="1"/>
<text x="636" y="142" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,84,46)">5. Written to graph</text>
<text x="636" y="160" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(46,111,64)">memory_nodes (kind=session)</text>

<!-- usage signal side effect -->
<line x1="636" y1="182" x2="636" y2="204" class="edge" marker-end="url(#a3)"/>
<rect x="536" y="204" width="200" height="60" rx="8" fill="rgb(245,244,241)" stroke="rgb(137,135,129)" stroke-width="1"/>
<text x="636" y="223" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(90,88,83)">usage signals</text>
<text x="636" y="241" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(120,118,113)">rag_chunk_feedback signal=used</text>

<!-- dedupe write, bottom row -->
<line x1="636" y1="264" x2="636" y2="286" class="edge" marker-end="url(#a3)"/>
<rect x="536" y="286" width="200" height="60" rx="8" fill="rgb(245,244,241)" stroke="rgb(137,135,129)" stroke-width="1"/>
<text x="636" y="305" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(90,88,83)">dedupe bookkeeping</text>
<text x="636" y="323" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(120,118,113)">INSERT session_ingest_state</text>

<!-- schedule footnote -->
<rect x="20" y="330" width="694" height="50" rx="8" fill="rgb(255,255,255)" stroke="rgb(200,198,193)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="367" y="349" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(90,88,83)">Scheduled nightly</text>
<text x="367" y="366" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(120,118,113)">scripts/nightly_memory.sh (launchd / systemd) runs this ingestor first, before consolidation and pruning</text>
</svg>
