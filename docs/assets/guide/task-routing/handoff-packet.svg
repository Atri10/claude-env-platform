<svg width="100%" viewBox="0 0 760 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>HandoffPacket context rendering</title>
<desc>A diagram showing how HandoffHub.handoff assembles a HandoffPacket from caller-supplied objective, artifacts, paths, and notes, then renders it as an XML-tagged context string. The objective and artifact references render as plain tags. The in-scope paths list renders as plain tags. Sender-authored free-text notes render with a treat-as="data" attribute, marking them as data rather than instructions for the receiving agent's prompt. The whole block is wrapped in a handoff element carrying the source and destination agent names.</desc>
<defs>
<marker id="c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- inputs -->
<rect x="30" y="20" width="200" height="140" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="130" y="40" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">caller-supplied fields</text>
<text x="45" y="64" class="m" fill="rgb(95,94,90)">src, dst</text>
<text x="45" y="84" class="m" fill="rgb(95,94,90)">objective</text>
<text x="45" y="104" class="m" fill="rgb(95,94,90)">artifacts: dict</text>
<text x="45" y="124" class="m" fill="rgb(95,94,90)">paths: list</text>
<text x="45" y="144" class="m" fill="rgb(95,94,90)">notes: str</text>
<line x1="230" y1="90" x2="270" y2="90" class="edge" marker-end="url(#c3)"/>

<!-- HandoffPacket box -->
<rect x="270" y="20" width="220" height="140" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="42" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">HandoffPacket</text>
<text x="380" y="62" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">dataclass, no derived scope</text>
<text x="380" y="84" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">holds exactly what was passed in —</text>
<text x="380" y="100" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">no inheritance of sender's own</text>
<text x="380" y="116" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">context or permissions</text>
<text x="380" y="140" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">audit_event_id: set after logging</text>
<line x1="490" y1="90" x2="530" y2="90" class="edge" marker-end="url(#c3)"/>

<!-- audit -->
<rect x="530" y="20" width="200" height="140" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="630" y="42" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">audit ledger</text>
<text x="630" y="64" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">agent_action(</text>
<text x="630" y="82" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">  agent=src, action="handoff",</text>
<text x="630" y="98" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">  target=dst)</text>
<text x="630" y="122" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">actor recorded is always</text>
<text x="630" y="138" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">"orchestrator"</text>

<line x1="380" y1="160" x2="380" y2="192" class="edge" marker-end="url(#c3)"/>

<!-- context rendering -->
<rect x="120" y="192" width="520" height="300" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="214" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">HandoffPacket.context (rendered XML, prompt-injectable)</text>

<rect x="140" y="230" width="480" height="240" rx="6" fill="white" stroke="rgb(191,189,182)" stroke-width="1"/>
<text x="155" y="250" class="m" fill="rgb(68,68,65)">&lt;handoff from="src" to="dst"&gt;</text>
<text x="170" y="270" class="m" fill="rgb(68,68,65)">&lt;objective&gt;...&lt;/objective&gt;</text>

<rect x="150" y="284" width="460" height="30" rx="4" fill="rgb(238,237,254)"/>
<text x="170" y="299" class="m" fill="rgb(60,52,137)">&lt;artifacts&gt;&lt;ref name="k"&gt;v&lt;/ref&gt;&lt;/artifacts&gt;</text>

<rect x="150" y="320" width="460" height="30" rx="4" fill="rgb(238,237,254)"/>
<text x="170" y="335" class="m" fill="rgb(60,52,137)">&lt;in_scope_paths&gt;&lt;path&gt;...&lt;/path&gt;&lt;/in_scope_paths&gt;</text>

<rect x="150" y="356" width="460" height="34" rx="4" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="170" y="373" class="m" fill="rgb(113,43,19)">&lt;notes treat-as="data"&gt;...&lt;/notes&gt;</text>
<text x="170" y="386" class="s" fill="rgb(153,60,29)">sender prose — never replayed as instructions</text>

<text x="155" y="416" class="m" fill="rgb(68,68,65)">&lt;/handoff&gt;</text>

<text x="380" y="452" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">objective / artifacts / paths render as plain tags;</text>
<text x="380" y="468" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">only notes carries the explicit data marker.</text>
</svg>
