<svg width="100%" viewBox="0 0 760 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>verify_chain() algorithm and its callers</title>
<desc>A flowchart of AuditLogger.verify_chain: it loads all audit_events rows ordered by event_id ascending, starts an expected prev_hash of GENESIS, and for each row recomputes sha256(prev_hash + payload_json) comparing it to the stored event_hash and comparing the row's own stored prev_hash to the running expected value. On the first mismatch it returns false with that event's id. If it reaches the end without a mismatch it returns true. Below, two callers are shown: compliance_report.py calls verify_chain fresh on every report generation and embeds the verified boolean and first broken event id as the report's proof of integrity; session_replay.py does not call verify_chain at all, it only reads and reconstructs events for a given session_id.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .m { font-size: 10.5px; font-family: "SF Mono", "Menlo", monospace; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1 -->
<rect x="220" y="10" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Load all rows, ORDER BY event_id ASC</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">event_id, payload_json, prev_hash, event_hash</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#a2)"/>

<!-- Step 2 -->
<rect x="220" y="82" width="320" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="107" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">expected_prev_hash := "GENESIS"</text>
<line x1="380" y1="124" x2="380" y2="146" class="edge" marker-end="url(#a2)"/>

<!-- Loop box -->
<rect x="180" y="146" width="400" height="150" rx="8" fill="rgb(255,255,255)" stroke="rgb(95,94,90)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380" y="166" text-anchor="middle" class="t" fill="rgb(68,68,65)">for each row (ascending):</text>
<text x="200" y="188" class="m" fill="rgb(68,68,65)">expected = sha256(expected_prev_hash</text>
<text x="212" y="202" class="m" fill="rgb(68,68,65)">+ row.payload_json)</text>
<text x="200" y="224" class="m" fill="rgb(68,68,65)">if expected != row.event_hash</text>
<text x="212" y="238" class="m" fill="rgb(68,68,65)">or row.prev_hash != expected_prev_hash:</text>
<text x="224" y="252" class="m" fill="rgb(113,43,19)">return (False, row.event_id)</text>
<text x="200" y="274" class="m" fill="rgb(68,68,65)">expected_prev_hash := row.event_hash</text>

<line x1="380" y1="296" x2="380" y2="318" class="edge" marker-end="url(#a2)"/>
<rect x="220" y="318" width="320" height="42" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="343" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">loop completes -&gt; return (True, None)</text>

<line x1="580" y1="220" x2="660" y2="220" class="edge" marker-end="url(#a2)"/>
<rect x="640" y="195" width="100" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="215" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">(False,</text>
<text x="690" y="230" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">event_id)</text>

<!-- callers -->
<rect x="40" y="400" width="320" height="140" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="200" y="422" text-anchor="middle" class="t" fill="rgb(60,52,137)">compliance_report.py :: gather()</text>
<text x="60" y="446" class="s" fill="rgb(60,52,137)">calls AuditLogger(...).verify_chain()</text>
<text x="60" y="464" class="s" fill="rgb(60,52,137)">fresh on every report run</text>
<text x="60" y="486" class="s" fill="rgb(60,52,137)">embeds {verified, first_broken_event,</text>
<text x="60" y="502" class="s" fill="rgb(60,52,137)">total_events} as "proof of integrity"</text>
<text x="60" y="524" class="s" fill="rgb(60,52,137)">exit code is 1 if verified is false</text>

<rect x="400" y="400" width="320" height="140" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="560" y="422" text-anchor="middle" class="t" fill="rgb(68,68,65)">session_replay.py :: replay()</text>
<text x="420" y="446" class="s" fill="rgb(68,68,65)">does NOT call verify_chain() at all</text>
<text x="420" y="466" class="s" fill="rgb(68,68,65)">reads events WHERE session_id=?</text>
<text x="420" y="484" class="s" fill="rgb(68,68,65)">ordered by event_id, decodes payload_json</text>
<text x="420" y="502" class="s" fill="rgb(68,68,65)">and renders a per-event summary line</text>
<text x="420" y="522" class="s" fill="rgb(68,68,65)">— forensic reconstruction, not proof</text>

<line x1="220" y1="360" x2="200" y2="400" class="edge" marker-end="url(#a2)"/>
<line x1="540" y1="360" x2="560" y2="400" class="edge" marker-end="url(#a2)" stroke-dasharray="3 3"/>
</svg>
