<svg width="100%" viewBox="0 0 760 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>terminal.run sandbox and tool split</title>
<desc>The terminal MCP server exposes four tools. Three read-only tools (run_tests, run_benchmarks, run_audit) run immediately if the repo explicitly configured that command in .claude/commands.json, otherwise they return a not-configured directive without running anything. The fourth tool, terminal.run, is the only path for a state-mutating command; it always opens a human approval and blocks before running anything. Every command that does run, in either path, executes as an argv list via shlex.split with shell=False, a scrubbed environment allow-listing only PATH/HOME/LANG/LC_ALL/TMPDIR/VIRTUAL_ENV/PWD, the repo root as cwd, and a timeout (600s default, or the wait timeout for the approval step).</desc>
<defs>
<marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<rect x="280" y="10" width="200" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="28" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">terminal MCP server</text>
<text x="380" y="44" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">call_tool(name, arguments)</text>
<line x1="330" y1="56" x2="180" y2="88" class="edge" marker-end="url(#a5)"/>
<line x1="430" y1="56" x2="580" y2="88" class="edge" marker-end="url(#a5)"/>

<!-- left branch: read-only tools -->
<rect x="30" y="88" width="300" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="180" y="106" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">run_tests / run_benchmarks / run_audit</text>
<text x="180" y="124" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">kind in configured (.claude/commands.json)?</text>
<text x="180" y="140" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">yes -&gt; run immediately, no approval needed</text>
<line x1="180" y1="154" x2="180" y2="176" class="edge" marker-end="url(#a5)"/>
<rect x="30" y="176" width="300" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="180" y="196" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">not configured -&gt; NOT CONFIGURED text</text>
<text x="180" y="212" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">nothing runs; directive names commands.json</text>

<!-- right branch: terminal.run -->
<rect x="450" y="88" width="280" height="66" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="590" y="106" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">terminal.run (state-mutating)</text>
<text x="590" y="124" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">security_event() logged, then ALWAYS:</text>
<text x="590" y="140" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">human_approval_request() + open UI + block</text>
<line x1="590" y1="154" x2="590" y2="176" class="edge" marker-end="url(#a5)"/>
<rect x="450" y="176" width="280" height="50" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="590" y="196" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">_await_decision(req_id)</text>
<text x="590" y="212" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">approved / denied / still-pending (timeout)</text>

<line x1="180" y1="226" x2="380" y2="270" class="edge" marker-end="url(#a5)"/>
<line x1="590" y1="226" x2="450" y2="270" class="edge" stroke-dasharray="4 3" marker-end="url(#a5)"/>
<text x="470" y="252" class="s" fill="rgb(95,94,90)">only if approved</text>

<!-- shared sandbox box -->
<rect x="120" y="270" width="520" height="150" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="292" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">_run(template, kind) — the one execution path</text>
<text x="150" y="314" class="s" fill="rgb(95,94,90)">argv = shlex.split(template)  — no shell string is ever passed</text>
<text x="150" y="332" class="s" fill="rgb(95,94,90)">subprocess.run(argv, shell=False)  — no pipes, no shell interpolation</text>
<text x="150" y="350" class="s" fill="rgb(95,94,90)">cwd = REPO_ROOT  — cannot escape the repo directory</text>
<text x="150" y="368" class="s" fill="rgb(95,94,90)">env = _scrubbed_env()  — only PATH/HOME/LANG/LC_ALL/TMPDIR/VIRTUAL_ENV/PWD pass through</text>
<text x="150" y="386" class="s" fill="rgb(95,94,90)">timeout = CLAUDE_ENV_CMD_TIMEOUT (default 600s)  — TimeoutExpired is caught and audited</text>
<text x="150" y="404" class="s" fill="rgb(95,94,90)">every run is audited: tool_call(tool=f"terminal.{kind}", result_kind=f"exit{code}"/"timeout")</text>

<line x1="380" y1="420" x2="380" y2="442" class="edge" marker-end="url(#a5)"/>
<rect x="230" y="442" width="300" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="462" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">Result returned to the agent</text>
<text x="380" y="478" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">exit code + truncated stdout/stderr tail</text>

<text x="380" y="540" text-anchor="middle" class="s" fill="rgb(95,94,90)">There is no terminal.exec_unrestricted tool. Every executed command, on either path,</text>
<text x="380" y="556" text-anchor="middle" class="s" fill="rgb(95,94,90)">goes through the same shlex/argv-only, scrubbed-env, repo-root, timed sandbox in _run().</text>
</svg>
