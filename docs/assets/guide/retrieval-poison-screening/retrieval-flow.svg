<svg width="100%" viewBox="0 0 760 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Retriever.query() flow</title>
<desc>A vertical flowchart of Retriever.query(): embed the query, hybrid search LanceDB for top_k candidates, cross-encoder rerank to top_n, apply a usage-feedback boost and re-sort if enabled, record retrieval audit and quality metrics, then wrap every returned chunk in injection-safe retrieved_context delimiters before handing the list back to the calling agent. A side note flags that no poison/injection screening of chunk content happens in this file.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1 -->
<rect x="220" y="10" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">1. embed_query(text)</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">rag.config.get_embedder()</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#a3)"/>

<!-- Step 2 -->
<rect x="220" y="82" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">2. LanceStore.search()</text>
<text x="380" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">hybrid vector + FTS, top_k=40 candidates</text>
<line x1="380" y1="136" x2="380" y2="158" class="edge" marker-end="url(#a3)"/>

<!-- Step 3 -->
<rect x="220" y="158" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="178" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">3. reranker.rerank(top_n=8)</text>
<text x="380" y="196" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">cross-encoder, rag.config.get_reranker()</text>
<line x1="380" y1="212" x2="380" y2="234" class="edge" marker-end="url(#a3)"/>

<!-- Step 4: feedback boost -->
<rect x="200" y="234" width="360" height="66" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="254" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">4. Feedback boost (if boost_enabled())</text>
<text x="380" y="272" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">usage_boosts() from observability/feedback.py</text>
<text x="380" y="288" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">re-sort by _relevance(c) + feedback_boost, desc</text>
<line x1="380" y1="300" x2="380" y2="322" class="edge" marker-end="url(#a3)"/>

<!-- Step 5: record + audit -->
<rect x="180" y="322" width="400" height="66" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="342" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">5. Record retrieval + audit event</text>
<text x="380" y="360" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">record_retrieved() writes 'retrieved' feedback rows</text>
<text x="380" y="376" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">audit.retrieval() + record_retrieval_quality() metrics</text>
<line x1="380" y1="388" x2="380" y2="410" class="edge" marker-end="url(#a3)"/>

<!-- Step 6: wrap -->
<rect x="180" y="410" width="400" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="430" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">6. Wrap each chunk for injection safety</text>
<text x="380" y="448" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">&lt;retrieved_context source="..." lines="a-b"&gt;</text>
<text x="380" y="464" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">text&lt;/retrieved_context&gt; — stored as c["wrapped"]</text>
<line x1="380" y1="476" x2="380" y2="498" class="edge" marker-end="url(#a3)"/>

<!-- Step 7: return -->
<rect x="220" y="498" width="320" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="518" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">7. return ranked</text>
<text x="380" y="536" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">list[dict] handed to the calling agent/tool</text>

<!-- Side note: no poison screening -->
<rect x="600" y="158" width="150" height="130" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="675" y="180" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">No poison scan</text>
<text x="675" y="200" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">retrieve.py never</text>
<text x="675" y="216" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">imports or calls</text>
<text x="675" y="232" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">RagPoisonDetector.</text>
<text x="675" y="252" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">Delimiting is the</text>
<text x="675" y="268" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">only safeguard here.</text>
<line x1="600" y1="223" x2="560" y2="223" class="edge" stroke-dasharray="3,3" marker-end="url(#a3)"/>

<text x="380" y="600" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: delimiting happens unconditionally on every chunk; the feedback boost only re-orders, it never filters.</text>
</svg>
