<svg width="100%" viewBox="0 0 720 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Model path resolution order</title>
<desc>A vertical flowchart showing how rag/config.py resolves the embedding model path, reranker directory, and other tunables: environment variables are checked first and win if set, otherwise config/rag.yaml's value is used, otherwise a built-in numeric fallback applies. Model paths have no built-in fallback -- an unconfigured embedding model raises a clear error instead of guessing.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: env var -->
<rect x="200" y="10" width="320" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="360" y="32" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">1. Environment variable</text>
<text x="360" y="50" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">EMBED_MODEL_PATH, RERANKER_DIR, EMBED_DIM, ...</text>
<line x1="360" y1="70" x2="360" y2="92" class="edge" marker-end="url(#a1)" marker-start="none"/>
<line x1="360" y1="70" x2="360" y2="92" class="edge" marker-end="url(#a2)"/>
<text x="595" y="45" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">set? -&gt; wins, stop here</text>

<!-- Step 2: yaml -->
<rect x="200" y="92" width="320" height="60" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="360" y="114" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">2. config/rag.yaml</text>
<text x="360" y="132" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">embedding.model_path, reranker.model_dir, ...</text>
<line x1="360" y1="152" x2="360" y2="174" class="edge" marker-end="url(#a2)"/>
<text x="595" y="127" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">key present? -&gt; wins</text>

<!-- Step 3: fallback -->
<rect x="200" y="174" width="320" height="70" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="360" y="196" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">3. Built-in fallback (_BUILTIN)</text>
<text x="360" y="214" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">n_ctx=2048, n_gpu_layers=-1, embedding_dim=768</text>
<text x="360" y="230" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">model_path="" (never a name/path)</text>
<line x1="360" y1="244" x2="360" y2="266" class="edge" marker-end="url(#a2)"/>

<!-- Step 4: check -->
<rect x="160" y="266" width="400" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="360" y="288" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">get_embedder(): is model_path set?</text>
<text x="360" y="306" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">RagConfig.embedding.model_path non-empty?</text>
<line x1="260" y1="326" x2="260" y2="348" class="edge" marker-end="url(#a2)"/>
<line x1="460" y1="326" x2="460" y2="348" class="edge" marker-end="url(#a2)"/>
<text x="200" y="340" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">yes</text>
<text x="500" y="340" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">no</text>

<!-- outcome yes -->
<rect x="100" y="348" width="320" height="55" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="260" y="368" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">LlamaEmbedder.from_config(cfg)</text>
<text x="260" y="386" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">cached per model_path</text>

<!-- outcome no -->
<rect x="420" y="348" width="260" height="55" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="550" y="368" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">RuntimeError</text>
<text x="550" y="386" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">"No embedding model configured"</text>
</svg>
