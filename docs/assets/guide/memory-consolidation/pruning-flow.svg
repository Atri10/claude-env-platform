<svg width="100%" viewBox="0 0 760 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>memory_pruner.py: protect -> select -> archive -> delete</title>
<desc>Flowchart of prune_ns(): every node in a namespace is checked; decision and architecture node_kind values are always skipped regardless of confidence or age. Remaining nodes qualify for pruning if effective confidence has decayed below 0.1 and they have been stale (unaccessed) for 60+ days, or if they were superseded 30+ days ago. Qualifying nodes are appended as JSON lines to an archive file before their edges and node rows are deleted. Dry-run is the default; --apply is required to actually write and delete.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: iterate all nodes -->
<rect x="200" y="10" width="360" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">1. For each node in namespace</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">SELECT * FROM memory_nodes WHERE namespace=?</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#a2)"/>

<!-- Step 2: protected kind check -->
<rect x="200" y="82" width="360" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">2. node_kind in PROTECTED_KINDS?</text>
<text x="380" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">{"decision", "architecture"}</text>
<line x1="560" y1="107" x2="660" y2="107" class="edge" marker-end="url(#a2)"/>
<rect x="580" y="82" width="120" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="640" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">yes:</text>
<text x="640" y="118" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">continue (kept)</text>
<line x1="380" y1="138" x2="380" y2="160" class="edge" marker-end="url(#a2)"/>

<!-- Step 3: prune criteria -->
<rect x="160" y="160" width="440" height="76" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="180" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">3. (effective_confidence &lt; 0.1  AND  stale &#8805; 60d)</text>
<text x="380" y="198" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">OR  (superseded_by set  AND  age since update &#8805; 30d)</text>
<text x="380" y="220" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">stale = age_days(last_access) &#8805; STALE_DAYS</text>
<line x1="380" y1="236" x2="380" y2="258" class="edge" marker-end="url(#a2)"/>

<rect x="220" y="258" width="320" height="40" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="278" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(68,68,65)">no match &#8594; kept as-is</text>
<line x1="380" y1="298" x2="380" y2="320" class="edge" marker-end="url(#a2)" stroke-dasharray="4 3"/>

<!-- Step 4: dry-run gate -->
<rect x="200" y="320" width="360" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="340" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">4. --apply flag set?</text>
<text x="380" y="358" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">default is dry-run: report count only, change nothing</text>
<line x1="380" y1="370" x2="380" y2="392" class="edge" marker-end="url(#a2)"/>

<!-- Step 5: archive -->
<rect x="160" y="392" width="440" height="66" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="412" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">5. Append to ~/.claude-env/archive/memory/&lt;ns&gt;.jsonl</text>
<text x="380" y="430" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">one JSON line per node, all columns except "embedding"</text>
<text x="380" y="446" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">write happens before any DELETE runs</text>
<line x1="380" y1="458" x2="380" y2="480" class="edge" marker-end="url(#a2)"/>

<!-- Step 6: delete -->
<rect x="160" y="480" width="440" height="66" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="500" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">6. DELETE edges, then DELETE nodes</text>
<text x="380" y="518" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">memory_edges where src/dst IN (ids); then memory_nodes IN (ids)</text>
<text x="380" y="534" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">ids inlined into SQL text, not bound as "?" params</text>
<line x1="380" y1="546" x2="380" y2="568" class="edge" marker-end="url(#a2)"/>

<!-- Step 7: audit -->
<rect x="200" y="568" width="360" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="588" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">7. audit.memory_write(ns, "any", id, "prune")</text>
<text x="380" y="606" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">one row per pruned node id; memory_type literal is "any"</text>

<text x="380" y="655" text-anchor="middle" class="s" fill="rgb(95,94,90)">Invariant: decision/architecture nodes never reach step 3 — protection is a node_kind check, not confidence-based.</text>
</svg>
