<svg width="100%" viewBox="0 0 720 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>claude-env request lifecycle</title>
<desc>A flow diagram showing a single agent action's path: it starts at the agent, passes through an enforcement point (MCP server or native-tool hook), is evaluated by the policy engine against the incident switch and tier/allow/deny rules, and then branches three ways — denied, allowed, or routed to a human approval gate. Every branch, regardless of outcome, writes an entry to the tamper-evident audit ledger at the bottom.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .lbl-title { font-size: 14px; font-weight: 500; }
  .lbl-sub { font-size: 12px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
  .edge-label { font-size: 11px; fill: rgb(82,81,78); }
</style>

<!-- Agent action -->
<rect x="280" y="10" width="160" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="360" y="33" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(68,68,65)">Agent action</text>

<line x1="360" y1="56" x2="360" y2="90" class="edge" marker-end="url(#arrow2)"/>

<!-- Enforcement surface -->
<rect x="230" y="90" width="260" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="360" y="113" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(113,43,19)">MCP server / native-tool hook</text>

<line x1="360" y1="136" x2="360" y2="170" class="edge" marker-end="url(#arrow2)"/>

<!-- Policy engine -->
<rect x="200" y="170" width="320" height="70" rx="10" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
<text x="360" y="196" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(60,52,137)">Policy engine</text>
<text x="360" y="215" text-anchor="middle" dominant-baseline="central" class="lbl-sub" fill="rgb(83,74,183)">incident check &#8594; tier &#8594; deny &#8594; allow</text>

<line x1="360" y1="240" x2="360" y2="266" class="edge"/>

<!-- Three-way branch -->
<line x1="360" y1="266" x2="150" y2="300" class="edge" marker-end="url(#arrow2)"/>
<line x1="360" y1="266" x2="360" y2="300" class="edge" marker-end="url(#arrow2)"/>
<line x1="360" y1="266" x2="570" y2="300" class="edge" marker-end="url(#arrow2)"/>

<!-- Denied -->
<rect x="60" y="300" width="180" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="150" y="323" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(113,43,19)">Denied</text>

<!-- Allowed -->
<rect x="270" y="300" width="180" height="46" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="360" y="323" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(30,90,61)">Allowed</text>

<!-- Approval gate -->
<rect x="480" y="300" width="180" height="46" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="570" y="323" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(60,52,137)">Human approval gate</text>

<line x1="570" y1="346" x2="570" y2="370" class="edge" marker-end="url(#arrow2)"/>
<rect x="480" y="370" width="180" height="40" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
<text x="570" y="390" text-anchor="middle" dominant-baseline="central" class="lbl-sub" fill="rgb(83,74,183)">approve / deny recorded</text>

<!-- Converge to ledger -->
<line x1="150" y1="346" x2="150" y2="470" class="edge"/>
<line x1="360" y1="346" x2="360" y2="470" class="edge"/>
<line x1="570" y1="410" x2="570" y2="470" class="edge"/>

<line x1="150" y1="470" x2="620" y2="470" class="edge"/>
<line x1="360" y1="470" x2="360" y2="486" class="edge" marker-end="url(#arrow2)"/>

<!-- Audit ledger -->
<rect x="160" y="486" width="400" height="60" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="360" y="510" text-anchor="middle" dominant-baseline="central" class="lbl-title" fill="rgb(68,68,65)">Tamper-evident audit ledger</text>
<text x="360" y="528" text-anchor="middle" dominant-baseline="central" class="lbl-sub" fill="rgb(95,94,90)">hash-chained, append-only — every outcome is recorded</text>

</svg>
