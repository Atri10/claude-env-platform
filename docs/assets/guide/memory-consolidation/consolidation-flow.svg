<svg width="100%" viewBox="0 0 760 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>memory_consolidator.py: cluster -> merge -> summary node</title>
<desc>Flowchart of consolidate_ns(): eligible low-confidence, aged nodes connected by RELATES_TO edges are grouped into weakly-connected components, split by memory_type, and any group of at least MIN_CLUSTER=3 members becomes one new consolidated summary node linked to each source via a CONSOLIDATES edge. Source nodes are marked superseded_by, not deleted.</desc>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: eligibility filter -->
<rect x="200" y="10" width="360" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">1. Eligibility filter (per namespace)</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">effective_confidence &lt; 0.5  AND  age_days &#8805; 14</text>
<line x1="380" y1="66" x2="380" y2="88" class="edge" marker-end="url(#a1)"/>

<!-- Step 2: adjacency -->
<rect x="200" y="88" width="360" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="108" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">2. Build RELATES_TO adjacency</text>
<text x="380" y="126" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">edges where both src and dst are eligible</text>
<line x1="380" y1="144" x2="380" y2="166" class="edge" marker-end="url(#a1)"/>

<!-- Step 3: weakly connected components (DFS) -->
<rect x="200" y="166" width="360" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="186" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">3. Weakly-connected components</text>
<text x="380" y="204" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">iterative DFS stack over undirected adjacency</text>
<line x1="380" y1="222" x2="380" y2="244" class="edge" marker-end="url(#a1)"/>

<!-- Step 4: split by memory_type -->
<rect x="200" y="244" width="360" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="264" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">4. Split each component by memory_type</text>
<text x="380" y="282" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">a mixed-type component yields separate groups</text>
<line x1="380" y1="300" x2="380" y2="322" class="edge" marker-end="url(#a1)"/>

<!-- Step 5: MIN_CLUSTER gate -->
<rect x="200" y="322" width="360" height="56" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="342" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">5. Group size &#8805; MIN_CLUSTER (3)?</text>
<text x="380" y="360" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">smaller groups are left alone, untouched</text>
<line x1="560" y1="347" x2="660" y2="347" class="edge" marker-end="url(#a1)"/>
<rect x="580" y="322" width="120" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="640" y="347" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(68,68,65)">no: skip</text>
<line x1="380" y1="378" x2="380" y2="400" class="edge" marker-end="url(#a1)"/>

<!-- Step 6: build summary node -->
<rect x="180" y="400" width="400" height="70" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="420" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">6. add_node(mt, "concept", ...)</text>
<text x="380" y="438" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">name: "[consolidated] &lt;type&gt; cluster"</text>
<text x="380" y="454" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">body: {consolidated_from: [ids], summary: joined names (max 8)}</text>
<line x1="380" y1="470" x2="380" y2="492" class="edge" marker-end="url(#a1)"/>

<!-- Step 7: link + supersede -->
<rect x="150" y="492" width="460" height="86" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="512" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">7. For each source: CONSOLIDATES edge + supersede</text>
<text x="380" y="530" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">add_edge(new_id, old, "CONSOLIDATES")</text>
<text x="380" y="546" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">UPDATE memory_nodes SET superseded_by=new_id (source kept, not deleted)</text>
<text x="380" y="562" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">confidence = max(source confidences) &#8212; audited as operation="consolidate"</text>

<text x="380" y="600" text-anchor="middle" class="s" fill="rgb(95,94,90)">Confidence used in step 1/7 is effective_confidence() (decayed), not the stored column value.</text>
</svg>
