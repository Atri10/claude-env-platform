<svg width="100%" viewBox="0 0 760 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>budgets.py evaluate() flow</title>
<desc>A vertical flowchart: metrics_sessions rows accumulate est_cost_usd per session, evaluate() sums spend per repo for the calendar month to date, divides by that repo's configured budget (or the default), and classifies the result as unlimited, ok, warning, or EXCEEDED. Warning and EXCEEDED both fire a best-effort macOS notification and set the process exit code; only EXCEEDED sets exit code 1.</desc>
<defs>
<marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1 -->
<rect x="220" y="10" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">metrics_sessions</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">est_cost_usd per session, written by session ingest</text>
<line x1="380" y1="64" x2="380" y2="86" class="edge" marker-end="url(#b1)"/>

<!-- Step 2 -->
<rect x="220" y="86" width="320" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="106" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">month_to_date_spend()</text>
<text x="380" y="124" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">SUM(est_cost_usd) GROUP BY repo, started_at&#8805;month start</text>
<line x1="380" y1="140" x2="380" y2="162" class="edge" marker-end="url(#b1)"/>

<!-- Step 3 -->
<rect x="220" y="162" width="320" height="54" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="182" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">budget = repos[repo] or default</text>
<text x="380" y="200" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">config/budgets.yaml :: monthly_usd</text>
<line x1="380" y1="216" x2="380" y2="238" class="edge" marker-end="url(#b1)"/>

<!-- Step 4: decision diamond-ish -->
<rect x="180" y="238" width="400" height="54" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="258" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">pct = spent / budget</text>
<text x="380" y="276" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">budget &#8804; 0 &#8594; status is "unlimited", skip below</text>

<!-- branches -->
<line x1="260" y1="292" x2="180" y2="330" class="edge" marker-end="url(#b1)"/>
<line x1="380" y1="292" x2="380" y2="330" class="edge" marker-end="url(#b1)"/>
<line x1="500" y1="292" x2="600" y2="330" class="edge" marker-end="url(#b1)"/>

<!-- ok -->
<rect x="60" y="330" width="240" height="54" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="180" y="350" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">ok</text>
<text x="180" y="368" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">pct &lt; warn_at (default 0.8)</text>

<!-- warning -->
<rect x="260" y="330" width="240" height="54" rx="8" fill="rgb(250,244,224)" stroke="rgb(158,116,15)" stroke-width="1"/>
<text x="380" y="350" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(110,80,10)">warning</text>
<text x="380" y="368" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(158,116,15)">warn_at &#8804; pct &lt; 1.0</text>

<!-- exceeded -->
<rect x="480" y="330" width="240" height="54" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="600" y="350" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">EXCEEDED</text>
<text x="600" y="368" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">pct &#8805; 1.0</text>

<line x1="180" y1="384" x2="380" y2="420" class="edge" marker-end="url(#b1)"/>
<line x1="380" y1="384" x2="380" y2="420" class="edge" marker-end="url(#b1)"/>
<line x1="600" y1="384" x2="380" y2="420" class="edge" marker-end="url(#b1)"/>

<!-- notify -->
<rect x="180" y="420" width="400" height="54" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="440" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">warning/EXCEEDED &#8594; _notify() (macOS only, best-effort)</text>
<text x="380" y="458" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">osascript display notification; silently no-ops elsewhere or on failure</text>
<line x1="380" y1="474" x2="380" y2="496" class="edge" marker-end="url(#b1)"/>

<rect x="180" y="496" width="400" height="54" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="516" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">exit code: 1 only if overall == EXCEEDED</text>
<text x="380" y="534" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">"warning" alone still exits 0 — this is a soft cap, not an enforcement block</text>
</svg>
