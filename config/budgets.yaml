# claude-env :: cost budgets
# Monthly USD budgets checked against metrics_sessions.est_cost_usd
# (calendar month to date). 0 or absent = unlimited.
#
# `claude-env budget` prints the status table; exit code 1 when any budget is
# exceeded (usable in CI / shell prompts). warn_at is the fraction of budget
# at which a warning is emitted (and a macOS notification, when available).

warn_at: 0.8

monthly_usd:
  default: 0          # applies to any repo without an explicit entry; 0 = unlimited
  repos: {}
  #   payments: 150
  #   web-app:  75
