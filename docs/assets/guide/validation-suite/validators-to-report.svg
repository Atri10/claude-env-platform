<svg width="100%" viewBox="0 0 760 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>claude-env validate: six validators feeding one pass/fail report</title>
<desc>Six independent validator scripts under validation/ — installation, security, memory,
agents, mcp, and features — each run as a separate subprocess by bin/claude-env's validate
command, each printing its own PASS/FAIL/WARN lines and returning its own exit code. The CLI
ORs all exit codes together into one overall result: a single non-zero exit if any validator
failed, plus a companion validate_rag.py under rag/ invoked the same way for "validate all".</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<text x="380" y="26" text-anchor="middle" class="t" fill="rgb(68,68,65)">claude-env validate [all|&lt;name&gt;]</text>

<!-- CLI dispatcher box -->
<rect x="240" y="42" width="280" height="46" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="61" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">bin/claude-env</text>
<text x="380" y="77" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">spawns one subprocess per validator, ORs exit codes</text>

<!-- fan-out from dispatcher bottom center to 6 validators -->
<path d="M380 88 L380 100 L110 100 L110 118" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 100 L220 100 L220 118" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 100 L330 100 L330 118" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 118" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 100 L550 100 L550 118" fill="none" class="edge" marker-end="url(#a3)"/>
<path d="M380 88 L380 100 L650 100 L650 118" fill="none" class="edge" marker-end="url(#a3)"/>

<!-- 6 validator boxes -->
<rect x="20" y="118" width="180" height="72" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="110" y="138" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">validate_installation</text>
<text x="110" y="156" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">venv, dirs, DB tables,</text>
<text x="110" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">RAG config, audit chain</text>

<rect x="130" y="118" width="180" height="72" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1" transform="translate(90,0)"/>
<text x="330" y="138" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">validate_security</text>
<text x="330" y="156" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">policy block/allow, content</text>
<text x="330" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">scan, detectors, append-only</text>

<rect x="20" y="200" width="180" height="72" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1" transform="translate(200,0)"/>
<text x="220" y="220" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">validate_memory</text>
<text x="220" y="238" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">node/edge round-trip, recall,</text>
<text x="220" y="252" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">supersede, isolation, decay</text>

<rect x="20" y="118" width="180" height="72" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1" transform="translate(310,0)"/>
<text x="440" y="138" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">validate_agents</text>
<text x="440" y="156" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">registry, router, approval</text>
<text x="440" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">gate, conflict resolver</text>

<rect x="20" y="118" width="180" height="72" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1" transform="translate(420,0)"/>
<text x="550" y="138" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">validate_mcp</text>
<text x="550" y="156" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">topology, startup order,</text>
<text x="550" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">per-server security posture</text>

<rect x="20" y="118" width="180" height="72" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1" transform="translate(530,0)"/>
<text x="660" y="138" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">validate_features</text>
<text x="660" y="156" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">hooks, incident, sync,</text>
<text x="660" y="170" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">CLI coverage, isolated env</text>

<!-- converge to report -->
<path d="M110 190 L110 300 L380 300" fill="none" class="edge"/>
<path d="M330 190 L330 300 L380 300" fill="none" class="edge"/>
<path d="M220 272 L220 300 L380 300" fill="none" class="edge"/>
<path d="M440 190 L440 300 L380 300" fill="none" class="edge"/>
<path d="M550 190 L550 300 L380 300" fill="none" class="edge"/>
<path d="M660 190 L660 300 L380 300" fill="none" class="edge" marker-end="url(#a3)"/>
<line x1="380" y1="300" x2="380" y2="320" class="edge" marker-end="url(#a3)"/>

<!-- report box -->
<rect x="180" y="320" width="400" height="70" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="342" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">printed PASS / WARN / FAIL lines per check</text>
<text x="380" y="360" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">each script exits 0 (all pass, warns OK) or 1 (any FAIL)</text>
<text x="380" y="376" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">"validate all" ORs every exit code into one result</text>

<line x1="380" y1="390" x2="380" y2="412" class="edge" marker-end="url(#a3)"/>

<rect x="240" y="412" width="140" height="46" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="310" y="435" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">exit 0</text>
<rect x="380" y="412" width="140" height="46" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="450" y="435" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">exit 1 (any FAIL)</text>

<text x="380" y="500" text-anchor="middle" class="s" fill="rgb(95,94,90)">Each validator is an independent, standalone script — there is no shared</text>
<text x="380" y="516" text-anchor="middle" class="s" fill="rgb(95,94,90)">runner class; "all" is just the CLI looping subprocess calls and OR-ing exit codes.</text>
<text x="380" y="540" text-anchor="middle" class="s" fill="rgb(95,94,90)">A seventh target, "rag" &#8594; rag/validate_rag.py, runs the same way but lives</text>
<text x="380" y="556" text-anchor="middle" class="s" fill="rgb(95,94,90)">outside validation/ (covered in the RAG pipeline doc, not here).</text>
</svg>
