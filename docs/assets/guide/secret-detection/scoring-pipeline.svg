<svg width="100%" viewBox="0 0 760 900" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RagPoisonDetector.scan_chunk() scoring pipeline</title>
<desc>A vertical flowchart showing how RagPoisonDetector.scan_chunk computes a score for one
chunk of text: it first delegates to PromptInjectionDetector.scan to get an injection score,
separately computes an instruction-density score by counting imperative tokens relative to
word count, takes the max of the two, compares that combined score against two thresholds
(0.4 flagged, 0.8 blocked), and if flagged (and the injection sub-scan itself did not already
flag it) writes a rag_poison security_event to the audit log.</desc>
<defs>
<marker id="b3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .s { font-size: 11px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Step 1: input -->
<rect x="220" y="10" width="320" height="50" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">Chunk text in</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">scan_chunk(text, source)</text>
<line x1="380" y1="60" x2="380" y2="82" class="edge" marker-end="url(#b3)"/>

<!-- Step 2: split into two parallel sub-computations -->
<rect x="60" y="82" width="290" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="205" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">PromptInjectionDetector.scan()</text>
<text x="205" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">9 weighted regex patterns, 0.5-0.95</text>
<text x="205" y="136" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">v.score = max(weight) of matches</text>

<rect x="410" y="82" width="290" height="70" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="555" y="102" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">instruction-density score</text>
<text x="555" y="120" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">imperative-token count /</text>
<text x="555" y="136" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">max(1, word count) * 10, capped 1.0</text>

<line x1="380" y1="82" x2="205" y2="82" class="edge"/>
<line x1="380" y1="82" x2="555" y2="82" class="edge" marker-end="url(#b3)"/>
<line x1="205" y1="152" x2="205" y2="180" class="edge"/>
<line x1="555" y1="152" x2="555" y2="180" class="edge"/>
<line x1="205" y1="180" x2="555" y2="180" class="edge"/>

<!-- Step 3: combine -->
<line x1="380" y1="180" x2="380" y2="202" class="edge" marker-end="url(#b3)"/>
<rect x="180" y="202" width="400" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="222" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">combined score = max(injection score, density score)</text>
<text x="380" y="242" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">the two signals never add — the stronger one wins</text>
<line x1="380" y1="258" x2="380" y2="280" class="edge" marker-end="url(#b3)"/>

<!-- Step 4: threshold 0.4 -->
<rect x="220" y="280" width="320" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="300" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">score &#8805; 0.4 ?</text>
<text x="380" y="318" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">flagged threshold (not configurable)</text>
<line x1="540" y1="308" x2="640" y2="308" class="edge" marker-end="url(#b3)"/>
<rect x="640" y="283" width="100" height="50" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="690" y="303" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">clean</text>
<text x="690" y="320" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">flagged=false</text>
<line x1="380" y1="336" x2="380" y2="358" class="edge" marker-end="url(#b3)"/>

<!-- Step 5: threshold 0.8 -->
<rect x="220" y="358" width="320" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="378" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">score &#8805; 0.8 ?</text>
<text x="380" y="396" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">blocked threshold — caller drops the chunk</text>
<line x1="540" y1="386" x2="640" y2="386" class="edge" marker-end="url(#b3)"/>
<rect x="640" y="361" width="100" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="690" y="381" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">blocked</text>
<text x="690" y="398" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(113,43,19)">verdict.blocked</text>
<line x1="380" y1="414" x2="380" y2="436" class="edge" marker-end="url(#b3)"/>

<!-- Step 6: flagged not blocked -->
<rect x="180" y="436" width="400" height="56" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="456" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">flagged=true, blocked=false</text>
<text x="380" y="474" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">0.4 &#8804; score &lt; 0.8 — surfaced but not dropped</text>
<line x1="380" y1="492" x2="380" y2="514" class="edge" marker-end="url(#b3)"/>

<!-- Step 7: audit guard -->
<rect x="160" y="514" width="440" height="70" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="380" y="536" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">audit guard: only if flagged and NOT v.flagged</text>
<text x="380" y="554" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">skips a second audit row when the injection sub-scan already</text>
<text x="380" y="570" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">wrote one for the same text (PromptInjectionDetector.scan)</text>
<line x1="380" y1="584" x2="380" y2="606" class="edge" marker-end="url(#b3)"/>

<!-- Step 8: audit write -->
<rect x="220" y="606" width="320" height="56" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="626" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">audit.security_event("rag_poison", "medium", ...)</text>
<text x="380" y="644" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">detail = instruction_density=&lt;value&gt;, source=chunk source</text>

<text x="380" y="700" text-anchor="middle" class="s" fill="rgb(95,94,90)">Note: reasons on the returned Verdict include "high_density" whenever density &gt; 0.05 —</text>
<text x="380" y="718" text-anchor="middle" class="s" fill="rgb(95,94,90)">a looser threshold than the 0.4/0.8 score gates, so a Verdict can list "high_density" without being flagged.</text>
</svg>
