name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (light deps only)
        # llama-cpp-python and onnxruntime are imported lazily, so the test
        # suite runs without building the native inference backends. Install
        # the package without its declared deps, then add the light runtime +
        # dev deps the tests actually import.
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install \
            "pyyaml>=6.0" "click>=8.1" "lancedb>=0.7.0" "pyarrow>=14.0" \
            "mcp>=1.0" "tree-sitter>=0.21" "tree-sitter-language-pack>=0.2" \
            "python-dotenv>=1.0" \
            "pytest>=7.4" "pytest-asyncio>=0.21" "ruff>=0.1.0"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          EMBED_BACKEND: dummy
          RERANKER_BACKEND: noop
        run: pytest -q

  build:
    name: build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify packaged data ships in the wheel
        # Guards against the package-data regression where config/sql/templates
        # (and the .claude dotdir tree) silently drop out of the wheel.
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          def count(prefix):
              return sum(1 for n in names if prefix in n)
          config = count("_data/config/")
          sql = count("_data/sql/")
          templates = count("_data/templates/")
          claude_tree = count("_data/templates/repo-onboarding/.claude/")
          print(f"config={config} sql={sql} templates={templates} .claude={claude_tree}")
          assert config >= 5, "config data missing from wheel"
          assert sql >= 3, "sql schema missing from wheel"
          assert claude_tree >= 20, ".claude template tree missing from wheel"
          assert any("claudenv/py.typed" in n for n in names), "py.typed missing"
          print("OK: packaged data present")
          PY

      - name: Check metadata (twine)
        run: |
          pip install twine
          twine check dist/*
