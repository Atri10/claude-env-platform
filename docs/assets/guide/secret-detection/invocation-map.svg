<svg width="100%" viewBox="0 0 760 660" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Where the three detector classes are invoked</title>
<desc>A map showing security/detectors.py in the center, with three classes
(PromptInjectionDetector, SecretDetector, RagPoisonDetector) and their respective callers:
RagPoisonDetector is called from the lancedb-rag MCP server at retrieval time and the
documentation MCP server at fetch time; SecretDetector.redact is called from the memory
session ingestor and memory sync export path; PromptInjectionDetector is used directly by
validation/validate_security.py and internally by RagPoisonDetector. A separate note shows
that hooks/policy_hook.py imports the raw SECRET_PATTERNS list rather than the SecretDetector
class, for Bash and Write/Edit content scanning.</desc>
<defs>
<marker id="c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .t { font-size: 12px; font-weight: 500; }
  .s { font-size: 10.5px; font-weight: 400; }
  .edge { fill: none; stroke: rgb(137,135,129); stroke-width: 1.5px; }
</style>

<!-- Center: detectors.py -->
<rect x="260" y="10" width="240" height="56" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="380" y="30" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(68,68,65)">security/detectors.py</text>
<text x="380" y="48" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(95,94,90)">3 classes + 2 pattern lists</text>

<!-- Column geometry: 3 columns, 230px wide, 15px gaps -> x = 20, 265, 510 -->

<!-- RagPoisonDetector column (x: 20-250) -->
<line x1="330" y1="66" x2="135" y2="108" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="108" width="230" height="52" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="135" y="128" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">RagPoisonDetector</text>
<text x="135" y="145" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">wraps PromptInjection + density</text>

<line x1="135" y1="160" x2="135" y2="182" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="182" width="230" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="135" y="200" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">lancedb-rag/server.py</text>
<text x="135" y="217" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">scan_chunk() per retrieved hit</text>
<text x="135" y="232" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">blocked chunks silently</text>
<text x="135" y="244" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">dropped from results</text>

<line x1="135" y1="248" x2="135" y2="270" class="edge" marker-end="url(#c3)"/>
<rect x="20" y="270" width="230" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="135" y="288" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">documentation/server.py</text>
<text x="135" y="305" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">scan_chunk() on fetched body</text>
<text x="135" y="320" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">fetch returns a BLOCKED</text>
<text x="135" y="332" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">message instead of content</text>

<!-- SecretDetector column (x: 265-495) -->
<line x1="380" y1="66" x2="380" y2="108" class="edge" marker-end="url(#c3)"/>
<rect x="265" y="108" width="230" height="52" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="380" y="128" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">SecretDetector</text>
<text x="380" y="145" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.scan() and .redact()</text>

<line x1="380" y1="160" x2="380" y2="182" class="edge" marker-end="url(#c3)"/>
<rect x="265" y="182" width="230" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="200" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">memory/session_ingestor.py</text>
<text x="380" y="217" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">.redact() on task/outcome</text>
<text x="380" y="232" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">text before every episodic</text>
<text x="380" y="244" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">session node is stored</text>

<line x1="380" y1="248" x2="380" y2="270" class="edge" marker-end="url(#c3)"/>
<rect x="265" y="270" width="230" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="380" y="288" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">memory/memory_sync.py</text>
<text x="380" y="305" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">.redact() on node name/body</text>
<text x="380" y="320" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">at EXPORT time, before</text>
<text x="380" y="332" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">cross-agent sharing</text>

<!-- PromptInjectionDetector column (x: 510-740) -->
<line x1="430" y1="66" x2="625" y2="108" class="edge" marker-end="url(#c3)"/>
<rect x="510" y="108" width="230" height="52" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="625" y="128" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(60,52,137)">PromptInjectionDetector</text>
<text x="625" y="145" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(83,74,183)">.scan(text, source)</text>

<line x1="625" y1="160" x2="625" y2="182" class="edge" marker-end="url(#c3)"/>
<rect x="510" y="182" width="230" height="66" rx="8" fill="rgb(233,244,236)" stroke="rgb(46,125,86)" stroke-width="1"/>
<text x="625" y="200" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(30,90,61)">validate_security.py</text>
<text x="625" y="217" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">exercises all 3 classes with</text>
<text x="625" y="232" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">known-bad inputs (no</text>
<text x="625" y="244" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(30,90,61)">pytest file exists)</text>

<!-- Separate note: SECRET_PATTERNS raw import -->
<rect x="90" y="390" width="580" height="96" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1"/>
<text x="380" y="412" text-anchor="middle" dominant-baseline="central" class="t" fill="rgb(113,43,19)">hooks/policy_hook.py — a different pattern entirely</text>
<text x="380" y="432" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">imports the raw SECRET_PATTERNS list, NOT the SecretDetector class</text>
<text x="380" y="448" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">re.search() per pattern on Bash command strings and Write/Edit content;</text>
<text x="380" y="464" text-anchor="middle" dominant-baseline="central" class="s" fill="rgb(153,60,29)">result is "ask" (human confirms), never a silent block or redact</text>
<line x1="380" y1="66" x2="380" y2="390" class="edge" stroke-dasharray="4,3"/>

<text x="380" y="520" text-anchor="middle" class="s" fill="rgb(95,94,90)">All three classes write security_event rows on flag/block — the audit ledger,</text>
<text x="380" y="536" text-anchor="middle" class="s" fill="rgb(95,94,90)">not the caller's return value alone, is the durable record of a detection.</text>
</svg>
